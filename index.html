<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Güzel Dinimi Öğreniyorum</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --blue:#2f6fd6; --blue-d:#1f4fa8; --blue-l:#e8f0fd;
  --green:#3aa65a; --green-d:#2a7f43; --green-l:#e7f6ea;
  --gold:#f5b82e; --ink:#183a73; --muted:#5b6f93;
  --bg:#f3f7fd; --card:#ffffff; --line:#dfe7f4; --track:#e3eaf6;
  --wrong:#e25b4f; --wrong-l:#fdecea;
  color-scheme: light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --blue:#5b92ee; --blue-d:#3d6fc4; --blue-l:#1b2a45;
    --green:#4cbf6c; --green-d:#38a057; --green-l:#17301f;
    --ink:#e6eeff; --muted:#a3b3d1; --bg:#0f1729; --card:#18233a;
    --line:#26344f; --track:#24314b; --wrong:#ff7b6f; --wrong-l:#3a1f1e;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --blue:#5b92ee; --blue-d:#3d6fc4; --blue-l:#1b2a45;
  --green:#4cbf6c; --green-d:#38a057; --green-l:#17301f;
  --ink:#e6eeff; --muted:#a3b3d1; --bg:#0f1729; --card:#18233a;
  --line:#26344f; --track:#24314b; --wrong:#ff7b6f; --wrong-l:#3a1f1e;
  color-scheme: dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Baloo 2","Nunito","Trebuchet MS",system-ui,sans-serif;font-size:17px;line-height:1.45;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--blue)}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.app{max-width:520px;margin:0 auto;min-height:100vh;padding-bottom:92px;position:relative}
/* Header */
.hero{position:relative;background:var(--blue);padding:18px 16px 0;overflow:hidden}
.hero .pattern{position:absolute;inset:0;opacity:.12}
.arch{position:relative;margin:6px auto 0;max-width:360px;background:var(--card);border:4px solid var(--green);border-bottom:0;border-radius:180px 180px 0 0;padding:58px 20px 18px;text-align:center}
.arch h1{margin:0;font-size:clamp(28px,8vw,38px);line-height:1;color:var(--blue-d);font-weight:800}
.arch p{margin:4px 0 0;font-size:clamp(20px,5.6vw,26px);color:var(--green-d);font-weight:700;line-height:1.1}
.arch .dome{position:absolute;top:10px;left:50%;transform:translateX(-50%)}
.lantern{position:absolute;top:0}
.settings{position:absolute;top:14px;right:14px;width:44px;height:44px;border-radius:50%;background:var(--card);display:grid;place-items:center;box-shadow:0 2px 6px rgba(0,0,0,.15);z-index:2}
/* Sections */
main{padding:0 16px}
.greet{display:flex;align-items:center;gap:8px;padding:18px 0 8px}
.greet h2{margin:0;font-size:34px;line-height:1;color:var(--ink)}
.greet p{margin:4px 0 0;color:var(--muted);font-size:18px}
.greet .kid{flex:0 0 auto;margin-left:auto}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:6px}
.cat{position:relative;border-radius:20px;overflow:hidden;text-align:left;background:var(--card);box-shadow:0 3px 0 var(--line),0 6px 16px rgba(30,60,120,.08);transition:transform .15s}
.cat:active{transform:scale(.97)}
.cat svg{display:block;width:100%;height:auto}
.cat .lbl{display:flex;align-items:center;justify-content:space-between;padding:6px 12px 8px;color:#fff;font-weight:800;font-size:22px}
.cat.b .lbl{background:var(--blue)} .cat.g .lbl{background:var(--green)}
.chev{width:30px;height:30px;border-radius:50%;background:#fff;display:grid;place-items:center}
.cat small{display:block;font-weight:600;font-size:13px;opacity:.9;margin-top:-4px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 16px;margin-top:14px}
.journey{display:flex;gap:12px;align-items:center}
.bar{height:12px;border-radius:8px;background:var(--track);overflow:hidden;margin:6px 0}
.bar>i{display:block;height:100%;background:var(--green);border-radius:8px;transition:width .5s}
.journey h3{margin:0;font-size:21px;color:var(--blue-d)}
.cta{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;margin:16px 0 4px;padding:13px;border-radius:999px;background:var(--green);color:#fff;font-weight:700;font-size:20px;box-shadow:0 4px 0 var(--green-d)}
.cta:active{transform:translateY(2px);box-shadow:0 2px 0 var(--green-d)}
.cta.blue{background:var(--blue);box-shadow:0 4px 0 var(--blue-d)}
.cta[disabled]{opacity:.45;pointer-events:none}
/* Nav */
nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
nav .in{max-width:520px;margin:0 auto;display:flex}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;padding:8px 0 6px;font-size:14px;color:var(--muted);font-weight:600;position:relative}
nav button.on{color:var(--blue)}
nav button.on::after{content:"";position:absolute;bottom:2px;width:36px;height:4px;border-radius:4px;background:var(--blue)}
/* Sub pages */
.top{display:flex;align-items:center;gap:10px;padding:14px 16px;color:#fff;position:sticky;top:env(safe-area-inset-top,0px);z-index:4}
.top.b{background:var(--blue)} .top.g{background:var(--green)}
.top h2{margin:0;font-size:24px;line-height:1.1}
.top .back{width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.22);display:grid;place-items:center;flex:0 0 auto}
.unit{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin-top:10px}
.unit .num{flex:0 0 40px;height:40px;border-radius:12px;display:grid;place-items:center;font-weight:800;color:#fff}
.unit .t{flex:1;font-weight:700;font-size:17px;line-height:1.2}
.stars{font-size:15px;letter-spacing:1px;white-space:nowrap}
.stars .off{opacity:.25;filter:grayscale(1)}
.intro{color:var(--muted);margin:14px 2px 0}
/* Lesson */
.lesson{padding:16px}
.steps{display:flex;gap:6px;margin-bottom:14px}
.steps i{flex:1;height:6px;border-radius:6px;background:var(--track)}
.steps i.on{background:var(--gold)}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:22px 20px;min-height:220px;box-shadow:0 4px 0 var(--line)}
.card .ic{font-size:40px;line-height:1}
.card h3{margin:8px 0 6px;font-size:22px;color:var(--blue-d);line-height:1.2}
.card p{margin:0;font-size:19px;line-height:1.5}
.opt{display:block;width:100%;text-align:left;padding:13px 16px;margin-top:10px;border-radius:16px;border:2px solid var(--line);background:var(--card);font-size:18px;font-weight:600}
.opt.ok{border-color:var(--green);background:var(--green-l)}
.opt.no{border-color:var(--wrong);background:var(--wrong-l)}
.fb{margin-top:12px;font-weight:700;font-size:18px;min-height:28px}
.done{text-align:center;padding:30px 16px}
.done .big{font-size:56px;letter-spacing:4px}
.done h2{font-size:30px;margin:8px 0 4px}
.row{display:flex;gap:10px}
.row .cta{flex:1}
.ghost{display:block;width:100%;margin-top:12px;padding:10px;border-radius:999px;border:2px solid var(--line);font-weight:700;color:var(--muted)}
label.f{display:block;font-weight:700;margin-bottom:6px}
input[type=text]{width:100%;font:inherit;font-size:19px;padding:10px 14px;border-radius:14px;border:2px solid var(--line);background:var(--bg);color:var(--ink)}
.note{font-size:14px;color:var(--muted);margin-top:18px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.pop{animation:pop .35s ease}
@keyframes pop{0%{transform:scale(.96);opacity:.4}100%{transform:none;opacity:1}}
</style>
</head>
<body>
<div class="app" id="app"></div>
<nav><div class="in" id="nav"></div></nav>

const KID=`<svg width="104" height="104" viewBox="0 0 120 120" aria-hidden="true"><path d="M30 120 Q30 80 60 78 Q90 80 90 120Z" fill="#2f6fd6"/><circle cx="60" cy="52" r="28" fill="#f6cfa8"/><path d="M32 50 Q30 22 60 22 Q90 22 88 50 Q80 36 60 36 Q40 36 32 50Z" fill="#7a4a2a"/><path d="M34 36 Q60 4 86 36 Q60 28 34 36Z" fill="#fff" stroke="#cfe2ff" stroke-width="2"/><circle cx="50" cy="54" r="3.4" fill="#3a2414"/><circle cx="70" cy="54" r="3.4" fill="#3a2414"/><circle cx="44" cy="62" r="4" fill="#f5a9a0" opacity=".6"/><circle cx="76" cy="62" r="4" fill="#f5a9a0" opacity=".6"/><path d="M50 66 Q60 74 70 66" stroke="#a0442a" stroke-width="2.5" fill="none" stroke-linecap="round"/><rect x="40" y="88" width="40" height="28" rx="3" fill="#1f6f4a"/><rect x="56" y="94" width="8" height="16" rx="2" fill="none" stroke="#f5b82e" stroke-width="2"/></svg>`;
const PATTERN=`<svg class="pattern" width="100%" height="100%" aria-hidden="true"><defs><pattern id="pt" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M24 2 L30 18 L46 24 L30 30 L24 46 L18 30 L2 24 L18 18Z" fill="none" stroke="#fff" stroke-width="1.5"/></pattern></defs><rect width="100%" height="100%" fill="url(#pt)"/></svg>`;
const LANTERN=(x,h)=>`<svg class="lantern" style="left:${x}px" width="28" height="${h+44}" aria-hidden="true"><line x1="14" y1="0" x2="14" y2="${h}" stroke="#a9e3b6" stroke-width="2"/><path d="M6 ${h+6} Q14 ${h-4} 22 ${h+6} V${h+32} Q14 ${h+40} 6 ${h+32}Z" fill="#3aa65a"/><rect x="10" y="${h+12}" width="8" height="14" rx="4" fill="#fff6c8"/></svg>`;
const CHEV=c=>`<span class="chev"><svg width="16" height="16" viewBox="0 0 16 16"><path d="M6 3l5 5-5 5" stroke="${c}" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></span>`;
const ICON={
 home:'<path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z" fill="currentColor"/>',
 book:'<path d="M2 5c3-1 6-1 10 1 4-2 7-2 10-1v14c-3-1-6-1-10 1-4-2-7-2-10-1z M12 6v14" fill="none" stroke="currentColor" stroke-width="2"/>',
 chart:'<path d="M5 20V12M10 20V6M15 20V10M20 20V4" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>',
 user:'<circle cx="12" cy="8" r="4" fill="none" stroke="currentColor" stroke-width="2"/><path d="M4 21c1-5 15-5 16 0" fill="none" stroke="currentColor" stroke-width="2"/>'
};
const esc=s=>String(s).replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
const starStr=n=>[0,1,2].map(i=>i<n?"⭐":'<span class="off">⭐</span>').join("");

/* ---------- Ekranlar ---------- */
const app=document.getElementById("app");
let tab="home";
function renderNav(){
 const items=[["home","Ana Sayfa"],["units","Üniteler"],["prog","İlerlemem"],["prof","Profil"]];
 document.getElementById("nav").innerHTML=items.map(([k,l])=>`<button class="${tab===k?"on":""}" onclick="go('${k}')"><svg width="26" height="26" viewBox="0 0 24 24">${ICON[{home:"home",units:"book",prog:"chart",prof:"user"}[k]]}</svg>${l}</button>`).join("");
}
function go(k){tab=k;({home,units:unitsTab,prog,prof})[k]();renderNav();window.scrollTo(0,0)}

function home(){
 const d=doneCount(), n=nextUnit();
 app.innerHTML=`
 <header class="hero">${PATTERN}${LANTERN(18,30)}${LANTERN(44,58)}
  <button class="settings" aria-label="Profil" onclick="go('prof')"><svg width="22" height="22" viewBox="0 0 24 24"><path d="M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8zm9 4l-2.1-.6.4-2.2-2-1.2-1.5 1.6-2-.9L13.4 6h-2.8l-.4 2.7-2 .9-1.5-1.6-2 1.2.4 2.2L3 12l.2 2.3 2.1.6-.4 2.2 2 1.2 1.5-1.6 2 .9.4 2.4h2.8l.4-2.4 2-.9 1.5 1.6 2-1.2-.4-2.2 2.1-.6z" fill="#2f6fd6"/></svg></button>
  <div class="arch">
   <svg class="dome" width="70" height="48" viewBox="0 0 70 48" aria-hidden="true"><path d="M17 46 Q35 4 53 46Z" fill="#2f6fd6"/><rect x="6" y="20" width="6" height="26" fill="#2f6fd6"/><rect x="58" y="20" width="6" height="26" fill="#2f6fd6"/><path d="M38 2a7 7 0 1 0 0 12 5.5 5.5 0 1 1 0-12z" fill="#3aa65a"/></svg>
   <h1>Güzel Dinimi</h1><p>Öğreniyorum</p>
  </div>
 </header>
 <main>
  <div class="greet"><div><h2>Merhaba${S.name?", "+esc(S.name):""}! ⭐</h2><p>Bugün birlikte öğrenelim</p></div><div class="kid">${KID}</div></div>
  <div class="grid">${CATS.map((c,i)=>`<button class="cat ${c.c}" onclick="openCat(${i})">${ART[c.id]}<div class="lbl"><span>${c.name}<small>${c.sub}</small></span>${CHEV(c.c==="b"?"#2f6fd6":"#3aa65a")}</div></button>`).join("")}</div>
  <div class="panel journey"><svg width="46" height="46" viewBox="0 0 46 46" aria-hidden="true"><path d="M23 2l6 7 9-1-1 9 7 6-7 6 1 9-9-1-6 7-6-7-9 1 1-9-7-6 7-6-1-9 9 1z" fill="#3aa65a"/><path d="M23 13l3 6.5 7 .8-5.2 4.7 1.5 7L23 28.5 16.7 32l1.5-7L13 20.3l7-.8z" fill="#fff"/></svg>
   <div style="flex:1"><h3>Öğrenme Yolculuğum</h3><div class="bar"><i style="width:${d/TOTAL*100}%"></i></div><b>${d} / ${TOTAL}</b> ünite tamamlandı · ${starTotal()} ⭐</div></div>
  <button class="cta" ${n?"":"disabled"} onclick="continueNext()"><svg width="20" height="20" viewBox="0 0 20 20"><path d="M5 3l12 7-12 7z" fill="#fff"/></svg>${n?(d?"Öğrenmeye Devam Et":"Öğrenmeye Başla"):"Hepsini tamamladın! 🎉"}</button>
 </main>`;
}
function continueNext(){const n=nextUnit();if(n)openUnit(n[0],n[1])}
function unitList(ci){
 const c=CATS[ci];
 return c.units.map((u,ui)=>{const s=S.stars[uid(ci,ui)]||0;return `<button class="unit" onclick="openUnit(${ci},${ui})"><span class="num" style="background:var(--${c.c==="b"?"blue":"green"})">${ui+1}</span><span class="t">${esc(u.t)}</span><span class="stars">${starStr(s)}</span></button>`}).join("");
}
function openCat(ci){
 const c=CATS[ci];
 app.innerHTML=`<div class="top ${c.c}"><button class="back" aria-label="Geri" onclick="go('home')">${backIco()}</button><h2>${c.name}</h2></div><main><p class="intro">${c.units.length} ünite · Her ünitede ${c.units[0].p.length} ders kartı ve ${c.units[0].q.length} soru var.</p>${unitList(ci)}</main>`;
 window.scrollTo(0,0);
}
function backIco(){return '<svg width="18" height="18" viewBox="0 0 16 16"><path d="M10 3L5 8l5 5" stroke="#fff" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>'}
function unitsTab(){
 app.innerHTML=`<div class="top b"><h2>Üniteler</h2></div><main>${CATS.map((c,i)=>`<h3 style="margin:18px 2px 0;color:var(--${c.c==="b"?"blue-d":"green-d"});font-size:22px">${c.name}</h3>${unitList(i)}`).join("")}</main>`;
}
function prog(){
 app.innerHTML=`<div class="top b"><h2>İlerlemem</h2></div><main>
 <div class="panel" style="text-align:center"><div style="font-size:44px;font-weight:800;color:var(--blue-d)">${starTotal()} ⭐</div><div>${TOTAL*3} yıldızdan · ${doneCount()} / ${TOTAL} ünite</div></div>
 ${CATS.map((c,i)=>{const d=c.units.filter((u,ui)=>S.stars[uid(i,ui)]).length;return `<div class="panel"><div style="display:flex;justify-content:space-between;font-weight:700;font-size:19px"><span>${c.name}</span><span>${d} / ${c.units.length}</span></div><div class="bar"><i style="width:${d/c.units.length*100}%;background:var(--${c.c==="b"?"blue":"green"})"></i></div></div>`}).join("")}
 </main>`;
}
function prof(){
 app.innerHTML=`<div class="top b"><h2>Profil</h2></div><main>
 <div class="panel"><label class="f" for="nm">Adın</label><input id="nm" type="text" maxlength="20" value="${esc(S.name)}" placeholder="Örneğin Ayşe"><button class="cta blue" onclick="S.name=document.getElementById('nm').value.trim();save();go('home')">Kaydet</button></div>
 <button class="ghost" onclick="if(confirm('Tüm ilerleme silinsin mi?')){S.stars={};save();go('home')}">İlerlemeyi sıfırla</button>
 <p class="note">İçerik, Diyanet İşleri Başkanlığı’nın “Etkinliklerle Dinimi Öğreniyorum” kitabının konu sırasını takip eder; metinler kısa özetlerdir. İlerleme yalnızca bu cihazda saklanır.</p>
 </main>`;
}

/* ---------- Ders + Quiz ---------- */
let L=null;
function openUnit(ci,ui){
 const u=CATS[ci].units[ui];
 L={ci,ui,u,step:0,score:0,qs:u.q.map(([q,o,a])=>{const opts=o.map((t,i)=>({t,ok:i===a}));for(let i=opts.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[opts[i],opts[j]]=[opts[j],opts[i]]}return{q,opts}})};
 drawLesson();
}
function drawLesson(){
 const {ci,u,step}=L, c=CATS[ci], n=u.p.length+u.q.length;
 const head=`<div class="top ${c.c}"><button class="back" aria-label="Geri" onclick="openCat(${ci})">${backIco()}</button><h2>${esc(u.t)}</h2></div>`;
 const bar=`<div class="steps">${Array.from({length:n},(_,i)=>`<i class="${i<=step?"on":""}"></i>`).join("")}</div>`;
 if(step<u.p.length){
  const [ic,h,p]=u.p[step];
  app.innerHTML=`${head}<div class="lesson">${bar}<div class="card pop"><div class="ic">${ic}</div><h3>${esc(h)}</h3><p>${esc(p)}</p></div>
  <div class="row">${step>0?`<button class="cta blue" onclick="L.step--;drawLesson()">Geri</button>`:""}<button class="cta" onclick="L.step++;drawLesson()">${step===u.p.length-1?"Sorulara geç":"İleri"}</button></div></div>`;
 } else if(step<n){
  const Q=L.qs[step-u.p.length];
  app.innerHTML=`${head}<div class="lesson">${bar}<div class="card pop" style="min-height:0"><div class="ic">❓</div><h3>${esc(Q.q)}</h3></div>
  ${Q.opts.map((o,i)=>`<button class="opt" data-i="${i}" onclick="answer(${i})">${esc(o.t)}</button>`).join("")}
  <div class="fb" id="fb" aria-live="polite"></div><button class="cta" id="nx" style="display:none" onclick="L.step++;drawLesson()">${step===n-1?"Sonucu gör":"Sıradaki soru"}</button></div>`;
 } else finish();
 window.scrollTo(0,0);
}
function answer(i){
 const Q=L.qs[L.step-L.u.p.length], btns=[...document.querySelectorAll(".opt")];
 if(btns.some(b=>b.disabled))return;
 btns.forEach((b,k)=>{b.disabled=true;if(Q.opts[k].ok)b.classList.add("ok")});
 const fb=document.getElementById("fb");
 if(Q.opts[i].ok){L.score++;fb.textContent="Aferin! Doğru cevap 🌟";fb.style.color="var(--green-d)"}
 else{btns[i].classList.add("no");fb.textContent="Doğru cevap yeşil olan. Bir dahakine! 💪";fb.style.color="var(--wrong)"}
 document.getElementById("nx").style.display="flex";
}
function finish(){
 const {ci,ui,score}=L, total=L.qs.length, k=uid(ci,ui), stars=score===total?3:score>=total*2/3?2:1;
 S.stars[k]=Math.max(S.stars[k]||0,stars);save();
 const n=nextUnit();
 const msg=stars===3?"Harika! Hepsini bildin!":stars===2?"Çok güzel!":"Tebrikler, üniteyi bitirdin!";
 app.innerHTML=`<div class="done pop"><div class="big">${starStr(stars)}</div><h2>${msg}</h2><p>${score} / ${total} doğru cevap</p>
 ${n?`<button class="cta" onclick="continueNext()">Sıradaki ünite</button>`:""}
 <button class="cta blue" onclick="openUnit(${ci},${ui})">Tekrar dene</button>
 <button class="ghost" onclick="go('home')">Ana sayfaya dön</button></div>`;
}

go("home");
</script>
</body>
</html>
