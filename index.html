<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Güzel Dinimi Öğreniyorum</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --blue:#2f6fd6; --blue-d:#1f4fa8; --blue-l:#e8f0fd;
  --green:#3aa65a; --green-d:#2a7f43; --green-l:#e7f6ea;
  --gold:#f5b82e; --ink:#183a73; --muted:#5b6f93;
  --bg:#f3f7fd; --card:#ffffff; --line:#dfe7f4; --track:#e3eaf6;
  --wrong:#e25b4f; --wrong-l:#fdecea;
  color-scheme: light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --blue:#5b92ee; --blue-d:#3d6fc4; --blue-l:#1b2a45;
    --green:#4cbf6c; --green-d:#38a057; --green-l:#17301f;
    --ink:#e6eeff; --muted:#a3b3d1; --bg:#0f1729; --card:#18233a;
    --line:#26344f; --track:#24314b; --wrong:#ff7b6f; --wrong-l:#3a1f1e;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --blue:#5b92ee; --blue-d:#3d6fc4; --blue-l:#1b2a45;
  --green:#4cbf6c; --green-d:#38a057; --green-l:#17301f;
  --ink:#e6eeff; --muted:#a3b3d1; --bg:#0f1729; --card:#18233a;
  --line:#26344f; --track:#24314b; --wrong:#ff7b6f; --wrong-l:#3a1f1e;
  color-scheme: dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Baloo 2","Nunito","Trebuchet MS",system-ui,sans-serif;font-size:17px;line-height:1.45;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--blue)}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.app{max-width:520px;margin:0 auto;min-height:100vh;padding-bottom:92px;position:relative}
/* Header */
.hero{position:relative;background:var(--blue);padding:18px 16px 0;overflow:hidden}
.hero .pattern{position:absolute;inset:0;opacity:.12}
.arch{position:relative;margin:6px auto 0;max-width:360px;background:var(--card);border:4px solid var(--green);border-bottom:0;border-radius:180px 180px 0 0;padding:58px 20px 18px;text-align:center}
.arch h1{margin:0;font-size:clamp(28px,8vw,38px);line-height:1;color:var(--blue-d);font-weight:800}
.arch p{margin:4px 0 0;font-size:clamp(20px,5.6vw,26px);color:var(--green-d);font-weight:700;line-height:1.1}
.arch .dome{position:absolute;top:10px;left:50%;transform:translateX(-50%)}
.lantern{position:absolute;top:0}
.settings{position:absolute;top:14px;right:14px;width:44px;height:44px;border-radius:50%;background:var(--card);display:grid;place-items:center;box-shadow:0 2px 6px rgba(0,0,0,.15);z-index:2}
/* Sections */
main{padding:0 16px}
.greet{display:flex;align-items:center;gap:8px;padding:18px 0 8px}
.greet h2{margin:0;font-size:34px;line-height:1;color:var(--ink)}
.greet p{margin:4px 0 0;color:var(--muted);font-size:18px}
.greet .kid{flex:0 0 auto;margin-left:auto}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:6px}
.cat{position:relative;border-radius:20px;overflow:hidden;text-align:left;background:var(--card);box-shadow:0 3px 0 var(--line),0 6px 16px rgba(30,60,120,.08);transition:transform .15s}
.cat:active{transform:scale(.97)}
.cat svg{display:block;width:100%;height:auto}
.cat .lbl{display:flex;align-items:center;justify-content:space-between;padding:6px 12px 8px;color:#fff;font-weight:800;font-size:22px}
.cat.b .lbl{background:var(--blue)} .cat.g .lbl{background:var(--green)}
.chev{width:30px;height:30px;border-radius:50%;background:#fff;display:grid;place-items:center}
.cat small{display:block;font-weight:600;font-size:13px;opacity:.9;margin-top:-4px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 16px;margin-top:14px}
.journey{display:flex;gap:12px;align-items:center}
.bar{height:12px;border-radius:8px;background:var(--track);overflow:hidden;margin:6px 0}
.bar>i{display:block;height:100%;background:var(--green);border-radius:8px;transition:width .5s}
.journey h3{margin:0;font-size:21px;color:var(--blue-d)}
.cta{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;margin:16px 0 4px;padding:13px;border-radius:999px;background:var(--green);color:#fff;font-weight:700;font-size:20px;box-shadow:0 4px 0 var(--green-d)}
.cta:active{transform:translateY(2px);box-shadow:0 2px 0 var(--green-d)}
.cta.blue{background:var(--blue);box-shadow:0 4px 0 var(--blue-d)}
.cta[disabled]{opacity:.45;pointer-events:none}
/* Nav */
nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
nav .in{max-width:520px;margin:0 auto;display:flex}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;padding:8px 0 6px;font-size:14px;color:var(--muted);font-weight:600;position:relative}
nav button.on{color:var(--blue)}
nav button.on::after{content:"";position:absolute;bottom:2px;width:36px;height:4px;border-radius:4px;background:var(--blue)}
/* Sub pages */
.top{display:flex;align-items:center;gap:10px;padding:14px 16px;color:#fff;position:sticky;top:env(safe-area-inset-top,0px);z-index:4}
.top.b{background:var(--blue)} .top.g{background:var(--green)}
.top h2{margin:0;font-size:24px;line-height:1.1}
.top .back{width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.22);display:grid;place-items:center;flex:0 0 auto}
.unit{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin-top:10px}
.unit .num{flex:0 0 40px;height:40px;border-radius:12px;display:grid;place-items:center;font-weight:800;color:#fff}
.unit .t{flex:1;font-weight:700;font-size:17px;line-height:1.2}
.stars{font-size:15px;letter-spacing:1px;white-space:nowrap}
.stars .off{opacity:.25;filter:grayscale(1)}
.intro{color:var(--muted);margin:14px 2px 0}
.unit .pg{display:block;font-weight:600;font-size:13px;color:var(--muted);margin-top:2px}
/* Lesson */
.lesson{padding:16px}
.steps{display:flex;gap:6px;margin-bottom:14px}
.steps i{flex:1;height:6px;border-radius:6px;background:var(--track)}
.steps i.on{background:var(--gold)}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:22px 20px;min-height:220px;box-shadow:0 4px 0 var(--line)}
.card .ic{font-size:40px;line-height:1}
.card h3{margin:8px 0 6px;font-size:22px;color:var(--blue-d);line-height:1.2}
.card p{margin:0;font-size:19px;line-height:1.5}
.opt{display:block;width:100%;text-align:left;padding:13px 16px;margin-top:10px;border-radius:16px;border:2px solid var(--line);background:var(--card);font-size:18px;font-weight:600}
.opt.ok{border-color:var(--green);background:var(--green-l)}
.opt.no{border-color:var(--wrong);background:var(--wrong-l)}
.fb{margin-top:12px;font-weight:700;font-size:18px;min-height:28px}
.done{text-align:center;padding:30px 16px}
.done .big{font-size:56px;letter-spacing:4px}
.done h2{font-size:30px;margin:8px 0 4px}
.row{display:flex;gap:10px}
.row .cta{flex:1}
.ghost{display:block;width:100%;margin-top:12px;padding:10px;border-radius:999px;border:2px solid var(--line);font-weight:700;color:var(--muted)}
label.f{display:block;font-weight:700;margin-bottom:6px}
input[type=text]{width:100%;font:inherit;font-size:19px;padding:10px 14px;border-radius:14px;border:2px solid var(--line);background:var(--bg);color:var(--ink)}
.note{font-size:14px;color:var(--muted);margin-top:18px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.pop{animation:pop .35s ease}
@keyframes pop{0%{transform:scale(.96);opacity:.4}100%{transform:none;opacity:1}}
.key{display:inline-grid;place-items:center;width:1.7em;height:1.7em;border-radius:50%;background:var(--blue-l);color:var(--blue-d);margin-right:12px;font-weight:800;flex:0 0 auto}
.opt{display:flex;align-items:center}
.card.talk{background:var(--green-l);border-color:var(--green)}
.top .fs{margin-left:auto}
.hint{text-align:center;color:var(--muted);font-size:15px;margin:14px 0 0}
.teams{display:flex;gap:12px;align-items:center;justify-content:center;margin-bottom:14px;flex-wrap:wrap}
.team{display:flex;align-items:center;gap:10px;padding:6px 10px 6px 16px;border-radius:999px;background:var(--card);border:3px solid var(--blue);font-weight:800}
.team.t1{border-color:var(--green)}
.team button{width:40px;height:40px;border-radius:50%;background:var(--blue-l);font-size:26px;font-weight:800;line-height:1}
.team b{min-width:2ch;text-align:center;font-size:30px}
.treset{width:40px;height:40px;border-radius:50%;border:2px solid var(--line);color:var(--muted);font-size:20px}
/* Sınıf Modu: projeksiyon / akıllı tahta */
:root.cls body{font-size:20px}
:root.cls .app,:root.cls nav .in{max-width:1180px}
:root.cls main{padding:0 32px}
:root.cls .arch{max-width:560px}
:root.cls .arch h1{font-size:56px}
:root.cls .arch p{font-size:38px}
:root.cls .greet h2{font-size:46px}
:root.cls .greet p{font-size:24px}
:root.cls .grid{grid-template-columns:repeat(4,1fr);gap:18px}
:root.cls .cat .lbl{font-size:28px}
:root.cls .cat small{font-size:16px}
:root.cls .journey h3{font-size:26px}
:root.cls .cta{font-size:26px;padding:16px}
:root.cls .top{padding:16px 32px}
:root.cls .top h2{font-size:34px}
:root.cls .top .back{width:48px;height:48px}
:root.cls .ulist{display:grid;grid-template-columns:1fr 1fr;column-gap:16px}
:root.cls .unit{padding:16px 18px}
:root.cls .unit .t{font-size:22px}
:root.cls .unit .pg{font-size:16px}
:root.cls .unit .num{flex-basis:48px;height:48px;font-size:22px}
:root.cls .stars{font-size:19px}
:root.cls .intro{font-size:22px}
:root.cls .lesson{padding:24px 32px}
:root.cls .steps i{height:10px}
:root.cls .card{padding:40px 52px;min-height:min(48vh,520px);display:flex;flex-direction:column;justify-content:center}
:root.cls .card .ic{font-size:clamp(56px,7vw,104px)}
:root.cls .card h3{font-size:clamp(32px,3.6vw,56px);margin:12px 0 14px}
:root.cls .card p{font-size:clamp(22px,min(2.7vw,4.8vh),42px);line-height:1.4}
:root.cls .card.q{padding:22px 40px}
:root.cls .card.q .ic{display:none}
:root.cls .card.q h3{margin:0;font-size:clamp(28px,min(3.4vw,6vh),54px)}
:root.cls .app:has(.lesson,.done){padding-bottom:16px}
:root.cls .app:has(.lesson,.done)~nav{display:none}
:root.cls .opt{font-size:clamp(22px,min(2.5vw,4.4vh),38px);padding:12px 22px;margin-top:12px}
:root.cls .fb{font-size:30px;min-height:44px}
:root.cls .hint{font-size:18px}
:root.cls .done .big{font-size:96px}
:root.cls .done h2{font-size:50px}
:root.cls .done p{font-size:28px}
:root.cls .done{max-width:720px;margin:0 auto}
:root.cls nav button{font-size:17px}
@media (max-height:800px){:root.cls .hint{display:none}:root.cls .lesson{padding-top:16px}:root.cls .teams{margin-bottom:10px}:root.cls .fb{min-height:36px;margin-top:8px}:root.cls .lesson .cta{margin:10px 0 0;padding:12px}:root.cls .card.q{padding:14px 32px}:root.cls .card.q h3{font-size:clamp(24px,min(2.8vw,5vh),44px)}:root.cls .opt{font-size:clamp(20px,min(2.2vw,3.7vh),34px);padding:8px 20px;margin-top:9px}:root.cls .key{width:1.55em;height:1.55em}:root.cls .teams{margin-bottom:8px}:root.cls .team button{width:34px;height:34px}:root.cls .steps{margin-bottom:10px}:root.cls .app:has(.lesson){padding-bottom:0}}
@media (max-width:800px){:root.cls .grid{grid-template-columns:1fr 1fr}:root.cls .ulist{display:block}:root.cls main,:root.cls .lesson{padding-left:16px;padding-right:16px}:root.cls .card{padding:28px 24px}}
</style>
</head>
<body>
<div class="app" id="app"></div>
<nav><div class="in" id="nav"></div></nav>

<script>
/* ---------- İçerik: “Etkinliklerle Dinimi Öğreniyorum” (DİB, 5. baskı 2019) – 4 bölüm, 29 ünite; metinler kitaba dayanan kendi özetlerimizdir. s = kitap sayfaları ---------- */
const CATS = [
 {id:"inanc", name:"İnanç", sub:"İman esaslarını öğreniyorum", c:"b", units:[
  {t:"Kelime-i Tevhid ve Kelime-i Şehâdeti Öğreniyorum", s:"8–13", d:"Çevrenizde kelime-i tevhid yazılı bir levha gördünüz mü? Kelime-i tevhidi ve kelime-i şehâdeti ne zaman ve neden söyleriz?", p:[
   ["☝️","Kelime-i Tevhid","“Lâ ilâhe illallah Muhammedün resûlullah.” Anlamı: Allah’tan başka ilah yoktur, Hz. Muhammed Allah’ın elçisidir."],
   ["🤲","Kelime-i Şehâdet","“Eşhedü en lâ ilâhe illallah ve eşhedü enne Muhammeden abdühû ve resûlüh.” Anlamı: Şahitlik ederim ki Allah’tan başka ilah yoktur; yine şahitlik ederim ki Hz. Muhammed O’nun kulu ve elçisidir."],
   ["🌟","Müslüman olmanın ilk adımı","Bu sözleri kalpten inanarak söyleyen kişiye Müslüman ya da mümin denir. İslam’ı kabul etmenin ilk şartı bu sözleri söylemektir."],
   ["💚","Rabbimi tanıyorum","Rabbimiz Allah’tır; eşi ve benzeri yoktur. Bizi ve her şeyi yaratan, rızık ve şifa veren, yaptığımız her şeyi gören ve duyan O’dur."],
   ["🍽️","Bismillâhirrahmânirrahîm","Bir işe başlarken besmele çekeriz: yemekte, okula giderken, ders çalışırken, yatarken. Peygamberimiz besmeleyle başlanan işin bereketli olacağını söylemiştir."],
   ["🙏","Elhamdülillâh ve Allâhü Ekber","Güzel bir işin sonunda “Elhamdülillâh” der, nimetler için Allah’a şükrederiz. “Allâhü Ekber” diyerek Allah’ın en büyük olduğunu dile getiririz."],
   ["📖","Bir ayet öğreniyorum","“Allah, kendisinden başka hiçbir ilah bulunmayandır.” (Tâhâ Sûresi, 8. Ayet)"]],
  q:[["“Lâ ilâhe illallah” ne demektir?",["Allah’tan başka ilah yoktur","Allah en büyüktür","Allah’a hamd olsun"],0],
     ["Kelime-i Şehâdet’te Hz. Muhammed nasıl anılır?",["Allah’ın kulu ve elçisi","Bir melek","Bir kral"],0],
     ["Kelime-i tevhidi ve şehâdeti inanarak söyleyen kişiye ne denir?",["Müslüman (mümin)","Muhacir","Hafız"],0],
     ["Bir işe başlarken ne deriz?",["Bismillâhirrahmânirrahîm","Elhamdülillâh","Âmin"],0],
     ["Güzel bir işin sonunda Allah’a şükretmek için ne deriz?",["Elhamdülillâh","Bismillâh","Merhaba"],0],
     ["“Allâhü Ekber” ne anlama gelir?",["Allah en büyüktür","Allah her şeyi bilir","Allah’a sığınırım"],0]]},
  {t:"İslam’ın ve İmanın Esaslarını Öğreniyorum", s:"14–19", d:"Peygamberimiz Müslümanı “elinden ve dilinden kimseye zarar gelmeyen kişi” diye tanıtıyor. Elimizle ve dilimizle insanları nasıl mutlu edebiliriz?", p:[
   ["🕌","Dinim İslam","Biz Müslümanız, dinimiz İslam’dır. Allah’a ve Hz. Muhammed’in O’nun kulu ve elçisi olduğuna gönülden inanırız."],
   ["6️⃣","İmanın 6 esası","Allah’a, meleklere, kitaplara, peygamberlere, âhiret gününe, kader ve kazaya inanmak."],
   ["🎵","Âmentü","İmanın esaslarını özetleyen söze “inandım” anlamına gelen Âmentü denir: “Âmentü billâhi ve melâiketihî ve kütübihî ve rusülihî…”"],
   ["5️⃣","İslam’ın 5 esası","Kelime-i şehâdet getirmek, namaz kılmak, oruç tutmak, zekât vermek ve gücü yetenin hacca gitmesi. İbadetler bunlarla sınırlı değildir ama bu beşi çok önemlidir."],
   ["🤝","Müslüman kimdir?","Peygamberimiz, Müslümanın elinden ve dilinden kimseye zarar gelmeyen kişi olduğunu söylemiştir. Müslüman güven veren insandır."],
   ["💬","Hadis","Peygamberimizin sözlerine hadis denir. Peygamberimiz bir hadisinde İslam’ın beş esas üzerine kurulduğunu bildirmiştir."],
   ["💚","Biz müminiz","Yalnız Allah’a kulluk eder, Peygamberimizin öğrettiklerini yaşarız. İyilikleri çoğaltmaya, kötülüklere engel olmaya çalışırız."]],
  q:[["İslam’ın kaç esası (şartı) vardır?",["5","3","6"],0],
     ["İmanın kaç esası vardır?",["6","5","4"],0],
     ["Hangisi imanın esaslarından biridir?",["Meleklere inanmak","Namaz kılmak","Zekât vermek"],0],
     ["Hangisi İslam’ın esaslarından biridir?",["Oruç tutmak","Meleklere inanmak","Kadere inanmak"],0],
     ["“Âmentü” ne demektir?",["İnandım","Şükrettim","Başladım"],0],
     ["Peygamberimize göre Müslüman kimdir?",["Elinden ve dilinden kimseye zarar gelmeyen kişi","En çok konuşan kişi","En zengin kişi"],0]]},
  {t:"Allah’a İnanıyorum", s:"20–25", d:"Bu sınıfta ve çevremizde Allah’ın yarattığı hangi nimetleri görüyoruz? Her biriniz bir nimet söylesin; sonra onunla ilgili Allah’ın bir güzel ismini bulalım.", p:[
   ["🌌","Kâinatı Allah yarattı","Gökleri, yıldızları, ayı ve güneşi yaratan Allah’tır. Gece ile gündüz ve mevsimler O’nun koyduğu düzenle oluşur."],
   ["☀️","Her şey bir ölçüyle","Dünya ile güneş arasındaki uzaklık bile ölçülüdür. Güneş daha yakın olsaydı her şey yanar, daha uzak olsaydı canlılar donardı."],
   ["🧒","İnsan çok değerlidir","Allah insana akıl, irade ve duygular verdi. Yerdeki ve gökteki güzellikler insana emanet edildi; yeter ki iyi bir hayat yaşasın ve iyilik yapsın."],
   ["🧭","Peygamberleri Allah gönderdi","İyi ile kötüyü, doğru ile yanlışı ayırabilmemiz için Allah bize yol gösterici olarak peygamberler gönderdi."],
   ["✨","Esmâ-ül Hüsnâ","Allah’ın 99 güzel ismi vardır. Bu isimleri Kur’an’dan ve hadislerden öğreniriz. Allah’ı tanıdıkça O’na olan sevgimiz artar."],
   ["💞","Güzel isimlerinden","er-Rahmân, er-Rahîm: çok merhametli. el-Vedûd: kullarını çok seven. er-Rezzâk: rızık veren. el-Hâlık: yaratan. el-Basîr: gören. es-Semî‘: işiten. el-Adl: adaletli."],
   ["📖","Bir sure öğreniyorum: İhlâs","“De ki: O Allah birdir. Allah Samed’dir (her şey O’na muhtaçtır). Doğurmamış ve doğmamıştır. Hiçbir şey O’na denk değildir.” (İhlâs Sûresi, 1–4)"]],
  q:[["Allah’ın güzel isimlerine ne denir?",["Esmâ-ül Hüsnâ","Kelime-i Tevhid","Siyer"],0],
     ["“el-Hâlık” isminin anlamı nedir?",["Yaratan","Affeden","Rızık veren"],0],
     ["“el-Vedûd” isminin anlamı nedir?",["Kullarını çok seven","Her şeyi gören","Çok cömert olan"],0],
     ["Allah’ın kaç güzel ismi vardır?",["99","40","114"],0],
     ["Güneş dünyaya çok yakın olsaydı ne olurdu?",["Her şey yanabilirdi","Hiçbir şey değişmezdi","Hep kar yağardı"],0],
     ["Allah’ın bir olduğunu anlatan kısa sure hangisidir?",["İhlâs Sûresi","Fil Sûresi","Kevser Sûresi"],0]]},
  {t:"Meleklere İnanıyorum", s:"26–28", d:"İyi birine neden “melek gibi insan” deriz? Melek gibi bir insan nasıl davranır? Örnekler verelim.", p:[
   ["🌟","Melekler kimdir?","Melekler nurdan yaratılmış, gözle görülmeyen varlıklardır. Allah’ın sayısız meleği vardır ve her yerde bulunabilirler."],
   ["🍃","Meleklerin özellikleri","Kadın ya da erkek değillerdir. Yemeye, içmeye, uyumaya ihtiyaç duymazlar. Asla kötülük yapmaz, günah işlemezler; gece gündüz Allah’a ibadet ederler."],
   ["🤗","Melekler dostumuzdur","Başarımız ve korunmamız için dua ederler. İyilik yaptığımızda sevinir, sevap yazarlar; kötülük yapınca üzülür, pişman olmamızı beklerler."],
   ["📜","Cebrâil ve Mikâil","Cebrâil, Allah’tan aldığı vahyi peygamberlere getirir. Mikâil, yağmur, kar ve rüzgâr gibi tabiat olaylarıyla görevlidir."],
   ["🎺","İsrâfil ve Azrâil","Azrâil, ömrü biten canlıların ölümüyle görevlidir. İsrâfil, dünya hayatı sona ereceği zaman Sûr’a üfleyerek bunu haber verecektir."],
   ["📖","Bir ayet öğreniyorum","“Göklerde ve yerde bulunan canlılar ve melekler, büyüklük taslamadan Allah’a secde ederler.” (Nahl Sûresi, 49. Ayet)"]],
  q:[["Peygamberlere vahiy getiren melek hangisidir?",["Cebrâil","Mikâil","İsrâfil"],0],
     ["Melekler neden yaratılmıştır?",["Nurdan","Topraktan","Ateşten"],0],
     ["Ölüm meleği olarak bilinen melek hangisidir?",["Azrâil","Mikâil","Cebrâil"],0],
     ["Sûr’a üfleyerek dünya hayatının sona erdiğini haber verecek melek hangisidir?",["İsrâfil","Mikâil","Cebrâil"],0],
     ["Tabiat olaylarıyla görevli melek hangisidir?",["Mikâil","Azrâil","İsrâfil"],0],
     ["Meleklerle ilgili hangisi YANLIŞTIR?",["Sadece cennette yaşarlar","Kötülük yapmazlar","Yemeye içmeye ihtiyaç duymazlar"],0]]},
  {t:"Kitaplara İnanıyorum", s:"29–37", d:"Kur’an okumayı öğrenmek neden önemli? Hatim yapmış birini tanıyor musunuz? Bir hatim merasiminde neler olur, anlatalım.", p:[
   ["📚","İlâhî kitaplar","Allah, dünyada ve âhirette mutlu olmamızın yollarını öğretmek için kitaplar gönderdi. Bunlara ilâhî kitaplar denir."],
   ["📖","Dört büyük kitap","Tevrat Hz. Mûsâ’ya, Zebûr Hz. Dâvûd’a, İncil Hz. Îsâ’ya, Kur’an-ı Kerim Hz. Muhammed’e indirildi."],
   ["📗","Kur’an-ı Kerim","Son ilâhî kitaptır ve bütün insanlar içindir. Dili Arapçadır. Tek harfi bile değişmeden bize ulaştı. Okumak ve ezberlemek ibadettir."],
   ["🌙","“Oku!”","Kur’an, 610 yılı Ramazan ayında Kadir Gecesi’nde indirilmeye başlandı. İlk ayetler “Oku!” emriyle başlar. Tamamlanması 23 yıl sürdü."],
   ["🔢","Ayet ve sure","Her cümleye ayet, ayetlerden oluşan bölümlere sure denir. 114 sure, 6236 ayet vardır. İlk sure Fâtiha, son sure Nâs; en uzunu Bakara, en kısası Kevser’dir."],
   ["🎓","Hatim, hafız, cüz","Kur’an’ı baştan sona okumaya hatim, tamamını ezberleyene hafız denir. Cüz yaklaşık yirmi sayfalık bölümdür. Biri okurken diğerlerinin takip etmesine mukabele denir."],
   ["🚢","Kur’an’dan bir kıssa","Kıssa, öğüt veren hikâyedir. Hz. Nûh, Allah’ın öğrettiği gibi büyük bir gemi yaptı; ona inananlar tufandan bu gemiyle kurtuldu."]],
  q:[["Kur’an-ı Kerim kaç sureden oluşur?",["114","40","23"],0],
     ["Zebûr hangi peygambere indirildi?",["Hz. Dâvûd","Hz. Mûsâ","Hz. Îsâ"],0],
     ["Kur’an’ın en uzun ve en kısa suresi hangileridir?",["Bakara – Kevser","Fâtiha – Nâs","İhlâs – Fil"],0],
     ["Kur’an ne zaman indirilmeye başlandı?",["610 yılı Ramazan ayında","571 yılında","622 yılında"],0],
     ["Kur’an’ın tamamını ezberleyen kişiye ne denir?",["Hafız","İmam","Müezzin"],0],
     ["Kur’an’ı baştan sona okumaya ne denir?",["Hatim","Cüz","Sure"],0]]},
  {t:"Peygamberlere İnanıyorum", s:"38–43", d:"Peygamberimize gençliğinde “Muhammedü’l-Emîn” denirdi. Güvenilir olmak neden çok önemlidir? Güvenilir insanların özellikleri nelerdir?", p:[
   ["🧭","İyilik öğretmenleri","Allah, mutluluğa giden yolu göstermeleri için peygamberler gönderdi. Onlar bize nasıl ibadet edeceğimizi ve nasıl iyi insan olacağımızı öğretir."],
   ["🔢","Kur’an’daki peygamberler","Kur’an’da 25 peygamberin adı geçer; Hz. Nûh, Hz. İbrâhim, Hz. Yûsuf, Hz. Mûsâ ve Hz. Îsâ bunlardandır. İlk peygamber Hz. Âdem, son peygamber Hz. Muhammed’dir."],
   ["⭐","Sıdk, emanet, fetânet","Peygamberler daima doğruyu söyler (sıdk), güvenilirdir (emanet), akıllı ve anlayışlıdır (fetânet)."],
   ["🛡️","İsmet ve tebliğ","Peygamberler günah işlemekten korunmuştur (ismet) ve Allah’tan aldıkları bilgileri insanlara aynen ulaştırırlar (tebliğ)."],
   ["🌊","Nil’e bırakılan bebek","Firavun’dan korunsun diye Hz. Mûsâ’nın annesi onu Allah’a emanet edip bir beşikle Nil’e bıraktı. Bebek saraya ulaştı ve Allah onu annesine kavuşturdu."],
   ["🌉","Deniz ikiye ayrıldı","Firavun ve ordusu peşlerine düşünce Hz. Mûsâ dua etti. Asâsını denize vurdu, deniz ikiye ayrıldı ve inananlar karşı kıyıya geçti."],
   ["💐","Son peygamber","Hz. Muhammed bütün insanlara rahmet, rehber ve müjdeci olarak gönderildi. Ondan sonra peygamber gelmeyecektir."]],
  q:[["İlk peygamber kimdir?",["Hz. Âdem","Hz. Nûh","Hz. İbrâhim"],0],
     ["Son peygamber kimdir?",["Hz. Muhammed","Hz. Îsâ","Hz. Mûsâ"],0],
     ["Peygamberlerin güvenilir olmasına ne denir?",["Emanet","Tebliğ","Fetânet"],0],
     ["Kur’an’da kaç peygamberin adı geçer?",["25","114","6"],0],
     ["Peygamberlerin günah işlemekten korunmuş olmasına ne denir?",["İsmet","Sıdk","Tebliğ"],0],
     ["Bebekken Nil nehrine bırakılan peygamber kimdir?",["Hz. Mûsâ","Hz. Yûsuf","Hz. Nûh"],0]]},
  {t:"Âhiret Hayatına İnanıyorum", s:"44–45", d:"“İyi ki âhiret var!” Âhiret olmasaydı ne olurdu? Âhirete inanmak bizi iyilik yapmaya nasıl yönlendirir?", p:[
   ["🌱","Ölüm son değildir","Canlılar doğar, yaşar ve ölür. Ama ölümden sonra yeni ve sonsuz bir hayat başlar. Bu hayata âhiret hayatı denir."],
   ["⚖️","Karşılık yurdu","Âhirette, dünyada yaptığımız iyi ya da kötü bütün işlerin karşılığını alacağız."],
   ["🏡","Cennet","İnanıp iyilik yapanlar cennete girecek. Peygamberimiz, cennette hiçbir gözün görmediği, hiçbir kulağın duymadığı nimetler olduğunu bildirmiştir."],
   ["🔥","Cehennem","Allah’a ve âhirete inanmayan, ömrünü kötülükle geçirenler cezalandırılacaktır. Allah zalimleri sevmez."],
   ["🌤️","İbadetin dünyada da faydası var","Abdestle temizlenir, oruçla sağlık bulur, namazla huzura kavuşuruz. Güzel işlerin en büyük ödülü ise âhirettedir."],
   ["📖","Bir ayet öğreniyorum","Kur’an, doğru ve dürüst insanların içinden ırmaklar akan cennetlerde sonsuza dek kalacağını; Allah’ın onlardan, onların da Allah’tan razı olacağını bildirir. (Mâide Sûresi, 119. Ayet)"]],
  q:[["Ölümden sonraki sonsuz hayata ne denir?",["Âhiret","Kader","Hicret"],0],
     ["Âhirette insanlar neyin karşılığını görür?",["Dünyada yaptıklarının","Sadece sözlerinin","Hiçbir şeyin"],0],
     ["İnanıp iyilik yapanlar nereye girecek?",["Cennete","Cehenneme","Hiçbir yere"],0],
     ["Allah kimleri sevmez?",["Zalimleri","İyilik yapanları","Sabredenleri"],0],
     ["Namaz kılınca dünyada ne buluruz?",["Huzur","Yorgunluk","Korku"],0],
     ["Peygamberimize göre cennette nasıl nimetler vardır?",["Hiçbir gözün görmediği nimetler","Dünyadakilerin aynısı","Hiç nimet yoktur"],0]]},
  {t:"Kader ve Kazaya İnanıyorum", s:"46–50", d:"İlk başta hoşunuza gitmeyen ama sonra “iyi ki olmuş” dediğiniz bir olay yaşadınız mı? Anlatalım.", p:[
   ["📐","Kader","Allah’ın olmuş ve olacak her şeyi önceden bilmesine kader denir."],
   ["✅","Kaza","Olayların vakti gelince meydana gelmesine kaza denir."],
   ["❄️","Karın güzelliği","Kar yağınca yollar kapanabilir, “keşke yağmasaydı” deriz. Baharda karlar erir, dereler çağlar, her yer yeşerir. O zaman karın ne büyük nimet olduğunu anlarız."],
   ["🌱","Tohumun hikâyesi","Toprağa gömülen tohum karanlıkta kaybolmuş sanılır ama zamanla filizlenir. Hoşumuza gitmeyen olayların sonu da hayırlı olabilir; acele karar vermeyiz."],
   ["👁️","Allah her şeyi bilir","Allah geçmişi de geleceği de bilir. O’nun bilgisi olmadan bir yaprak bile kımıldamaz. Her şey O’nun izniyle olur."],
   ["🧗","Çalış, dua et, güven","Kadere inanan insan tembellik yapmaz. Elinden geleni yapar, dua eder ve Allah’ın en hayırlısını yaratacağına güvenir. Buna tevekkül denir."],
   ["😊","Ümitsizlik yok","Başarınca Allah’a şükrederiz. İstediğimiz olmayınca ümitsizliğe düşmez, daha çok çalışırız."]],
  q:[["Allah’ın olmuş ve olacak her şeyi önceden bilmesine ne denir?",["Kader","Kaza","İrade"],0],
     ["Olayların vakti gelince meydana gelmesine ne denir?",["Kaza","Kader","Tevekkül"],0],
     ["Kadere inanan insan ne yapar?",["Çalışır, dua eder ve Allah’a güvenir","Hiç çalışmaz","Hemen ümitsizliğe düşer"],0],
     ["İstediğimiz bir şey olmazsa ne yaparız?",["Ümitsizliğe düşmeden daha çok çalışırız","Her şeyi bırakırız","Başkalarını suçlarız"],0],
     ["Kışın çok kar yağmasının baharda ne faydası olur?",["Sular çoğalır, her yer yeşerir","Hiçbir faydası olmaz","Yollar hep kapalı kalır"],0],
     ["Elimizden geleni yapıp sonucu Allah’a bırakmaya ne denir?",["Tevekkül","Tembellik","İsraf"],0]]}
 ]},
 {id:"ibadet", name:"İbadet", sub:"İbadetlerimi öğreniyorum", c:"g", units:[
  {t:"İbadetin Anlamını ve Çeşitlerini Öğreniyorum", s:"52–57", d:"Bugün Allah rızası için yapabileceğimiz küçük ibadetler neler olabilir? Her biriniz bir tane söylesin.", p:[
   ["💚","İbadet nedir?","Allah’ın sevgisini kazandıran her söz ve davranış ibadettir: namaz kılmak, oruç tutmak, Kur’an okumak, kurban kesmek, salavat getirmek gibi."],
   ["😊","Her iyilik ibadettir","Yoldaki engeli kaldırmak, gülümsemek, yol göstermek, yaşlıya yardım etmek, selam vermek, susamış bir hayvana su vermek de ibadettir; karşılığında sevap vardır."],
   ["🧍","Beden ve mal","Bazı ibadetleri bedenimizle (namaz, oruç), bazılarını malımızla (zekât, sadaka) yaparız. Hac hem bedenle hem malla yapılır."],
   ["📋","Farz ve sünnet","Allah’ın yapmamızı kesin olarak istediği ibadetlere farz denir. Peygamberimizin söz, davranış ve yaşayış biçimine sünnet denir."],
   ["⚖️","Helâl ve haram","Yasaklanmamış, yapılması ya da yenip içilmesi serbest olan şeylere helâl; kesin olarak yasaklanan şeylere haram denir. Allah temiz ve faydalı olanı helâl kılmıştır."],
   ["⭐","Sevap ve günah","İbadetlerimiz ve güzel davranışlarımız için Allah’ın verdiği ödüle sevap, dinimizin yasakladığı kötü davranışlara günah denir."],
   ["🙏","İbadetle şükrederiz","Dilimizle “Elhamdülillâh” der, bedenimizle namaz kılar, malımızla zekât veririz. İbadet bizi temiz, huzurlu ve merhametli yapar."]],
  q:[["Hangisi malla yapılan bir ibadettir?",["Zekât","Oruç","Namaz"],0],
     ["Hac nasıl bir ibadettir?",["Hem beden hem malla yapılan","Sadece sözle yapılan","Sadece malla yapılan"],0],
     ["Allah’ın yapmamızı kesin olarak istediği ibadetlere ne denir?",["Farz","Sünnet","Haram"],0],
     ["Kesin olarak yasaklanan şeylere ne denir?",["Haram","Helâl","Sevap"],0],
     ["Peygamberimizin söz ve davranışlarına ne denir?",["Sünnet","Farz","Kıble"],0],
     ["Hangisi ibadet DEĞİLDİR?",["Kırıcı söz söylemek","Hastayı ziyaret etmek","Susamış bir hayvana su vermek"],0]]},
  {t:"Cami ve Ezanı Öğreniyorum", s:"58–62", d:"Camiye ilk kez ne zaman ve kiminle gittiniz? En çok hangi bölümü dikkatinizi çekti? Evinize en yakın caminin adı ne?", p:[
   ["🕌","Camiler","Camiler birlikte ibadet ettiğimiz, hutbe, vaaz ve sohbetlerle bilgi öğrendiğimiz yerlerdir. Camileri temiz tutar, bakımına özen gösteririz."],
   ["🧭","Caminin içi","Mihrap: imamın namaz kıldırdığı yer. Minber: cuma ve bayram hutbesinin okunduğu merdivenli yer. Kürsü: vaaz ve sohbet yeri."],
   ["🗼","Caminin dışı","Kubbe: caminin yarım küre biçimli tavanı. Minare: ezan okunan yer. Şadırvan: avludaki abdest çeşmeleri."],
   ["👳","İmam ve müezzin","Namaz kıldıran, hutbe okuyan ve dinî bilgiler öğreten kişiye imam; ezan okuyan ve kamet getiren kişiye müezzin denir."],
   ["📣","İlk ezan","Medine’de Müslümanları namaza çağıracak bir işaret gerekiyordu. Ezanın sözleri Abdullah bin Zeyd’e rüyasında öğretildi; sesi gür ve güzel olan Hz. Bilâl ilk ezanı okudu."],
   ["🔊","Ezanın anlamı","“Allâhü Ekber”: Allah en büyüktür. “Hayye ale’s-salâh”: Haydi namaza! “Hayye ale’l-felâh”: Haydi kurtuluşa! Sabah ezanında “Namaz uykudan hayırlıdır” da denir."],
   ["⏰","Kamet","Farz namazdan önce namazın başlamak üzere olduğunu bildiren çağrıya kamet denir. Yeni doğan bebeğin sağ kulağına ezan, sol kulağına kamet okunur."]],
  q:[["İmamın namaz kıldırdığı yere ne denir?",["Mihrap","Minare","Şadırvan"],0],
     ["İlk ezanı kim okudu?",["Hz. Bilâl","Hz. Ali","Hz. Ömer"],0],
     ["Cuma ve bayram hutbesi nerede okunur?",["Minber","Kubbe","Kürsü"],0],
     ["Ezan okuyan kişiye ne denir?",["Müezzin","Vaiz","Hacı"],0],
     ["“Hayye ale’s-salâh” ne demektir?",["Haydi namaza!","Allah en büyüktür","Haydi kurtuluşa!"],0],
     ["Cami avlusundaki abdest çeşmelerine ne denir?",["Şadırvan","Kubbe","Kürsü"],0]]},
  {t:"Namazın Farzlarını Öğreniyorum", s:"63–71", d:"Abdesti hep birlikte, hareketlerle ve sırasıyla gösterelim. Sonra namazın 12 farzını sırayla sayalım.", p:[
   ["🕌","Namaz dinin direğidir","Namaz Allah’a olan sevgimizi canlı tutar ve huzur verir. Namazın 12 farzı vardır: 6’sı namazın dışında, 6’sı içinde."],
   ["🚿","Namazın dışındaki farzlar","Abdest almak (hadesten tahâret), beden-elbise-yerin temizliği (necasetten tahâret), örtülmesi gereken yerleri örtmek (setr-i avret), kıbleye yönelmek (istikbâl-i kıble), vakit ve niyet."],
   ["🧎","Namazın içindeki farzlar","“Allâhü Ekber” diyerek başlamak (iftitah tekbiri), ayakta durmak (kıyam), Kur’an okumak (kıraat), rükû, secde (sücûd) ve son oturuş (ka‘de-i âhire)."],
   ["💧","Abdestin farzları","Yüzü yıkamak, elleri ve kolları dirseklerle birlikte yıkamak, başı meshetmek, ayakları topuklarla birlikte yıkamak."],
   ["🪣","Abdest nasıl alınır?","Besmele ve niyetle başlarız. Ellerimizi yıkar, ağzımızı ve burnumuzu üçer kez temizleriz. Yüzümüzü ve kollarımızı yıkar; başımızı, kulaklarımızı ve boynumuzu meshederiz; en son ayaklarımızı yıkarız."],
   ["✋","Abdesti bozanlar","Tuvalet ihtiyacı ve gaz, ağız dolusu kusmak, uyumak, bayılmak, namazda sesli gülmek ve vücuttan kan ya da iltihap çıkması."],
   ["🏜️","Gusül ve teyemmüm","Gusül, bütün vücudun yıkandığı boy abdestidir. Su bulunmadığında ya da kullanılamadığında temiz toprakla teyemmüm yapılır."]],
  q:[["Namazın toplam kaç farzı vardır?",["12","6","4"],0],
     ["Kıbleye yönelmek hangi farzlardandır?",["Namazın dışındaki","Namazın içindeki","Orucun"],0],
     ["Hangisi abdestin farzlarındandır?",["Yüzü yıkamak","Ağza su vermek","Kulakları meshetmek"],0],
     ["“Kıraat” ne demektir?",["Namazda Kur’an okumak","Namazda ayakta durmak","Namaza niyet etmek"],0],
     ["Hangisi abdesti bozar?",["Uyumak","Terlemek","Konuşmak"],0],
     ["Su bulunmadığında ne yapılır?",["Teyemmüm","Gusül","İftar"],0]]},
  {t:"Namaz Kılıyorum", s:"72–87", d:"Beş vakit namazı kendi günümüzle karşılaştıralım: Hangi vakitte neredeyiz? Peygamberimizin nehir benzetmesinden ne anlıyoruz?", p:[
   ["🌅","Beş vakit","Sabah, öğle, ikindi, akşam ve yatsı. Namaz bizi günde beş kez Rabbimize yöneltir; ezan, vaktin girdiğini haber verir."],
   ["🧎","Namazın kılınışı","Niyet ve tekbir; kıyamda Sübhâneke, Fâtiha ve bir sure; rükûda “Sübhâne rabbiye’l-azîm”; doğrulurken “Semiallâhu limen hamideh”; secdede “Sübhâne rabbiye’l-a‘lâ”; oturuş ve selam."],
   ["🔢","Rekât sayıları","Sabah 2+2, öğle 4+4+2, ikindi 4+4, akşam 3+2, yatsı 4+4+2 (sünnet, farz, varsa son sünnet). Yatsıdan sonra 3 rekât vitir kılınır."],
   ["👥","Cemaatle namaz","Bir imama uyarak kılınan namazdır. Peygamberimiz cemaatle kılınan namazın tek başına kılınandan kat kat sevaplı olduğunu bildirmiştir."],
   ["🕌","Cuma namazı","Haftalık bayramımız olan cuma günü, öğle vaktinde camide cemaatle kılınır. 4 sünnet, 2 farz, 4 son sünnet: toplam 10 rekât. Hutbe dinlenir."],
   ["🌙","Teravih ve bayram namazı","Teravih, Ramazan’da yatsıdan sonra kılınan 20 rekâtlık namazdır. Bayram namazı, bayram sabahı cemaatle kılınan 2 rekâtlık namazdır."],
   ["🚫","Namazı bozanlar","Konuşmak, yemek ya da içmek, sesli gülmek, kıbleden başka yöne dönmek ve abdestin bozulması namazı bozar."],
   ["🏞️","Nehir benzetmesi","Peygamberimiz, kapısının önündeki nehirde günde beş kez yıkanan kişide kir kalmayacağı gibi beş vakit namazın da hatalarımızı sildiğini anlatmıştır."]],
  q:[["Akşam namazının farzı kaç rekâttır?",["3","2","4"],0],
     ["Günde kaç vakit namaz kılınır?",["5","3","7"],0],
     ["Cuma namazı toplam kaç rekâttır?",["10","4","2"],0],

     ["Bayram namazı kaç rekâttır?",["2","4","10"],0],
     ["Hangisi namazı bozar?",["Namazda konuşmak","Rükûya eğilmek","Secde etmek"],0]]},
  {t:"Oruç Tutuyorum", s:"88–102", d:"Hiç oruç tuttunuz ya da sahura kalktınız mı? İlk orucunuzda neler hissettiniz? Evde bir büyüğünüze çocukluğundaki Ramazanları sorun.", p:[
   ["🌙","Oruç nedir?","İbadet amacıyla imsak vaktinden iftar vaktine kadar hiçbir şey yememek ve içmemektir. Oruçlu kişi yalan, dedikodu ve kavgadan da uzak durur."],
   ["📖","Ramazan Kur’an ayıdır","Kur’an, Ramazan’da Kadir Gecesi’nde indirilmeye başlandı. Bu ayda oruç tutar, bol bol Kur’an okur, teravih kılar ve iftar sofralarımızı paylaşırız."],
   ["🍽️","Sahur ve niyet","Peygamberimizin sünnetine uyarak sahura kalkarız; sahurda bereket vardır. “Allah’ım, senin rızan için yarınki orucuma niyet ediyorum” diye niyet ederiz."],
   ["🌇","İftar ve iftar duası","Akşam ezanıyla orucu açarız: “Allâhümme leke sumtü ve bike âmentü ve aleyke tevekkeltü ve alâ rızkıke eftartü.” (Allah’ım, senin için oruç tuttum, sana inandım, sana güvendim, senin rızkınla orucumu açtım.)"],
   ["❓","Orucum bozuldu mu?","Bilerek yemek ve içmek orucu bozar. Unutarak yiyip içersek, hatırlayınca hemen bırakır ve oruca devam ederiz. Hastalar ve yolcular tutamadıkları oruçları sonra tutar."],
   ["💪","Orucun faydaları","Peygamberimiz “Oruç tutun, sağlık bulun” buyurmuştur. Oruç vücudu dinlendirir, sabrı ve şükrü öğretir, ihtiyaç sahiplerini anlamamızı sağlar."],
   ["🎉","Arefe ve bayram","Bayramdan önceki güne arefe denir. Bayram sabahı namaza gider, bayramlaşır, büyüklerin elini öper, küsleri barıştırır, kimsesizleri unutmayız."]],
  q:[["Orucu açmaya ne denir?",["İftar","Sahur","İmsak"],0],
     ["Hangi ayda oruç tutmak farzdır?",["Ramazan","Şevval","Muharrem"],0],
     ["Oruç hangi vakitte başlar?",["İmsak vaktinde","Öğle vaktinde","Yatsı vaktinde"],0],
     ["Oruçluyken unutarak bir şey yersek ne yaparız?",["Hatırlayınca bırakır, oruca devam ederiz","Orucumuz bozulmuş olur","Akşama kadar yemeye devam ederiz"],0],
     ["Bayramdan bir önceki güne ne denir?",["Arefe","Sahur","Kandil"],0],
     ["Peygamberimiz oruçla ilgili ne buyurmuştur?",["Oruç tutun, sağlık bulun","Oruç sadece büyükler içindir","Oruç gereksizdir"],0]]},
  {t:"Zekâtı Öğreniyorum", s:"103–106", d:"Bir şeyinizi paylaştığınızda kendinizi nasıl hissediyorsunuz? Sadaka sadece para mıdır? Parasız yapabileceğimiz sadakaları sayalım.", p:[
   ["🤝","Paylaşmanın adı","Zekât, İslam’ın beş esasından biridir ve para ya da malla yapılan bir ibadettir."],
   ["🙏","Neden zekât veririz?","Allah’ın verdiği zenginliğe teşekkür etmek için zekât veririz. Malımızda ihtiyaç sahiplerinin hakkı vardır; zekât bu hakkı onlara teslim etmektir."],
   ["🌉","Merhamet köprüsü","Zekât cimriliği ve kıskançlığı önler. Kalpten kalbe bir şefkat köprüsü kurar ve toplumda huzuru artırır."],
   ["➗","Ne kadar, kime?","Zengin Müslüman, zekâtı verilecek malının kırkta birini fakirlere ve ihtiyaç sahiplerine verir."],
   ["💝","Sadaka","Allah rızası için karşılıksız yapılan her yardım sadakadır. Kuşlara yem koymak, yoldaki çöpü kaldırmak, güler yüz göstermek bile sadakadır."],
   ["🌾","Fitre","Ramazan’da bayramdan önce ihtiyaç sahiplerine verilen sadakaya fitre (sadaka-i fıtr) denir."]],
  q:[["Zekât olarak malın ne kadarı verilir?",["Kırkta biri","Yarısı","Tamamı"],0],
     ["Zekât kimlere verilir?",["İhtiyaç sahiplerine","Sadece zenginlere","Kimseye"],0],
     ["Ramazan’da bayramdan önce verilen sadakaya ne denir?",["Fitre","Kurban","Hutbe"],0],
     ["Zekât hangi kötü duyguları önler?",["Cimrilik ve kıskançlığı","Sevgi ve merhameti","Sabrı"],0],
     ["Allah rızası için karşılıksız yapılan yardıma ne denir?",["Sadaka","Borç","Hutbe"],0],
     ["“Veren el, alan elden hayırlıdır” sözü hangi ibadeti hatırlatır?",["Zekât","Teravih","Oruç"],0]]},
  {t:"Haccı Öğreniyorum", s:"107–108", d:"Hacca ya da umreye gitmiş bir yakınınız var mı? Size neler anlattı? Haccın faydaları neler olabilir?", p:[
   ["🕋","Kutsal yolculuk","Hac, namazda yöneldiğimiz Kâbe’yi ve çevresindeki kutsal yerleri belirli günlerde ziyaret edip orada ibadet ve dua etmektir."],
   ["🧳","Kime farz?","Sağlığı ve maddi gücü yeten Müslümana ömründe bir kez farzdır."],
   ["🤍","İhram","Hacılar ihram denilen beyaz kıyafeti giyer. Zengin, fakir herkes Allah’ın huzurunda eşittir."],
   ["🔄","Haccın yapılışı","Kâbe tavaf edilir, Arafat’a çıkılır, kurban kesilir ve şeytan taşlanır. Bunları yapan kişi “hacı” olur."],
   ["🌍","Kardeşlik buluşması","Dünyanın her yerinden farklı dil ve renkte Müslümanlar Mekke’de buluşur; birlikte namaz kılar, insanlığın barışı için dua ederler."],
   ["🕌","Medine ziyareti","Hacılar Peygamberimizin doğup büyüdüğü yerleri görür, Medine’deki mescidini ve kabrini de ziyaret eder. Hac günlerinde Kurban Bayramı kutlanır."]],
  q:[["Kâbe hangi şehirdedir?",["Mekke","Medine","Kudüs"],0],
     ["Hac ömürde kaç kez farzdır?",["Bir kez","Her yıl","Hiç"],0],
     ["Hacda giyilen beyaz kıyafete ne denir?",["İhram","Cübbe","Sarık"],0],

     ["Peygamberimizin kabri nerededir?",["Medine","Mekke","Kudüs"],0],
     ["Hac günlerinde hangi bayram kutlanır?",["Kurban Bayramı","Ramazan Bayramı","Cuma"],0]]},
  {t:"Dua Ediyorum", s:"109–124", d:"Bugün kimin için dua etmek istersiniz? Herkes kendi sözleriyle kısa bir dua söylesin; sonra hep birlikte “Âmin” diyelim.", p:[
   ["🤲","Dua nedir?","Dua, her şeyi yaratan, her şeye gücü yeten ve hiçbir şeye muhtaç olmayan Allah’tan istemek ve O’na yalvarmaktır."],
   ["🌱","Her şey muhtaç","Tohum toprağa, toprak yağmura, balık suya, bebek annesine muhtaçtır. Biz de her an Allah’ın yardımına muhtacız; bu yüzden dua ederiz."],
   ["💚","Dua ibadetin özüdür","Bize göz, kulak, el, ayak ve sayısız nimet veren Allah’a dua ederek teşekkür ederiz. Yemekten önce besmele çeker, sonra “Elhamdülillâh” deriz."],
   ["🕰️","Ne zaman, nasıl?","Her zaman, her yerde, kendi sözlerimizle dua edebiliriz: yatarken, yolculukta, sınavda, hastalıkta, sevinçte. Sadece kendimiz için değil, başkaları için de dua ederiz."],
   ["🌟","Allah en hayırlısını bilir","Dua ettiğimiz her şey hemen olmayabilir. Allah bizi bizden iyi tanır ve bizim için en hayırlısını bilir. Ümidimizi kesmeden dua etmeye devam ederiz."],
   ["💬","Her anımız dua ile","Hastaya “Geçmiş olsun, Allah şifa versin”, yola çıkana “Allah’a emanet ol”, sınava girene “Allah zihin açıklığı versin” deriz."],
   ["📖","Kur’an’dan bir dua","“Rabbenâ âtinâ fi’d-dünyâ haseneten ve fi’l-âhireti haseneten…” Rabbimiz, bize dünyada da âhirette de iyilik ve güzellik ver. (Bakara Sûresi, 201. Ayet)"]],
  q:[["Yemekten sonra ne deriz?",["Elhamdülillâh","Allâhü Ekber","Âmin"],0],
     ["Dua kimden istemektir?",["Allah’tan","Meleklerden","Arkadaşlarımızdan"],0],
     ["Yemeğe nasıl başlarız?",["Besmele ile","Şarkı ile","Hiçbir şey demeden"],0],
     ["Sınava girecek birine ne deriz?",["Allah zihin açıklığı versin","Geçmiş olsun","Afiyet olsun"],0],
     ["Hasta birine ne deriz?",["Geçmiş olsun, Allah şifa versin","Hayırlı yolculuklar","İyi bayramlar"],0],
     ["Dua ettiğimiz şey hemen olmazsa ne yaparız?",["Allah en hayırlısını bilir, dua etmeye devam ederiz","Dua etmeyi bırakırız","Küseriz"],0]]}
 ]},
 {id:"siyer", name:"Siyer", sub:"Peygamberimi öğreniyorum", c:"b", units:[
  {t:"Peygamberimizin Çocukluğu ve Gençliği", s:"126–132", d:"Peygamberimizin yakın çevresinden kimleri hatırlıyoruz: annesi, babası, dedesi, amcası, sütannesi, eşi? Hacerü’l-Esved olayı bize ne öğretiyor?", p:[
   ["🌸","Doğumu","Peygamberimiz 571 yılında, 20 Nisan pazartesi günü Mekke’de doğdu. Babası Abdullah, o doğmadan iki ay önce vefat etmişti; annesi Hz. Âmine’dir."],
   ["💬","Muhammed: övülen","Dedesi Abdülmuttalib ona “Yerde insanlar, gökte melekler onu övsün” diyerek Muhammed adını verdi. Muhammed “övülen kişi” demektir."],
   ["🏕️","Sütannesi Halime","Mekke’nin sıcağından uzakta, sütannesi Halime’nin yanında büyüdü. Süt kardeşleri Şeyma, Abdullah ve Üneyse idi. Onun gelişiyle evin bereketi arttı."],
   ["💔","Annesini ve dedesini kaybetti","Altı yaşında annesini Ebvâ’da kaybetti. İki yıl dedesi Abdülmuttalib’le yaşadı; sekiz yaşındayken dedesi de vefat etti."],
   ["🏠","Amcası Ebû Tâlib","Amcası Ebû Tâlib ve yengesi Fâtıma onu kendi çocuklarından ayırmadan büyüttü. Amcasıyla birlikte ticaret için Şam’a bile gitti."],
   ["🤝","el-Emîn ve ailesi","Özü sözü bir olduğu için ona “Muhammedü’l-Emîn” (Güvenilir Muhammed) dendi. 25 yaşında Hz. Hatice ile evlendi. Çocukları: Kasım, Zeynep, Rukiye, Ümmü Gülsüm, Fâtıma, Abdullah ve İbrahim."],
   ["🪨","Hacerü’l-Esved","35 yaşındayken Kâbe tamirinde kabileler, taşı kimin koyacağı için kavga ediyordu. Peygamberimiz taşı bir örtüye koydu, her kabile bir ucundan tuttu, o da taşı yerine yerleştirdi."]],
  q:[["Peygamberimiz hangi şehirde doğdu?",["Mekke","Medine","Taif"],0],
     ["Peygamberimizin annesinin adı nedir?",["Hz. Âmine","Hz. Halime","Hz. Hatice"],0],
     ["Peygamberimizin sütannesi kimdir?",["Hz. Halime","Hz. Âmine","Hz. Fâtıma"],0],
     ["“Muhammed” isminin anlamı nedir?",["Övülen kişi","Seçilmiş kişi","Güçlü kişi"],0],
     ["Dedesi vefat edince Peygamberimizi kim yanına aldı?",["Amcası Ebû Tâlib","Sütannesi Halime","Hz. Ebû Bekir"],0],
     ["Kâbe tamirinde Peygamberimiz Hacerü’l-Esved’i nasıl yerine koydu?",["Taşı örtüye koyup her kabileye tutturdu","Taşı tek başına taşıdı","Kavgayı sadece izledi"],0]]},
  {t:"Peygamberimize İlk Vahyin Gelişi", s:"133–137", d:"Hz. Hatice, Peygamberimizi güzel ahlâkını hatırlatarak teselli etti. Bir arkadaşımız üzüldüğünde onu nasıl teselli ederiz?", p:[
   ["🏜️","O günlerin Mekke’si","İnsanlar putlara tapıyor, fakirler ve kimsesizler eziliyor, kadınlara ve çocuklara kötü davranılıyordu. Toplumda adalet kalmamıştı."],
   ["⛰️","Hira Mağarası","Bu durumdan rahatsız olan Peygamberimiz, düşünmek ve dua etmek için Hira Mağarası’na giderdi."],
   ["📖","“Oku!”","610 yılı Ramazan ayında, 40 yaşındayken Cebrâil geldi ve “Oku!” dedi. Alak Sûresi’nin ilk beş ayetini getirdi. Böylece peygamberlik görevi başladı."],
   ["💚","Hz. Hatice’nin desteği","Heyecanla eve dönen Peygamberimizi Hz. Hatice teselli etti: Sen akrabanı gözetir, doğru konuşur, fakire yardım edersin; Allah seni yalnız bırakmaz. Ona ilk inanan o oldu."],
   ["👥","İlk Müslümanlar","Hz. Hatice’nin yanı sıra Hz. Ebû Bekir, Hz. Ali, Hz. Bilâl ve Hz. Zeyd de Peygamberimize ilk inananlardandı."],
   ["🏔️","Safâ tepesindeki çağrı","Peygamberimiz Safâ’ya çıkıp “Bir ordu geliyor desem inanır mısınız?” diye sordu. “Evet, senden hiç yalan duymadık” dediler. Sonra onları Allah’ın birliğine çağırdı."],
   ["💪","Müslümanlar çoğalıyor","Peygamberimiz bütün zorluklara rağmen davetini sürdürdü. Hz. Hamza ve Hz. Ömer de Müslüman olunca Müslümanların sayısı kırka ulaştı."]],
  q:[["İlk vahiy nerede geldi?",["Hira Mağarası","Sevr Mağarası","Kâbe"],0],
     ["Peygamberimize ilk inanan kimdir?",["Hz. Hatice","Hz. Ömer","Hz. Hamza"],0],
     ["İlk vahiy geldiğinde Peygamberimiz kaç yaşındaydı?",["40","25","63"],0],
     ["İlk vahiy hangi yıl geldi?",["610","571","622"],0],
     ["Mekkeliler Safâ’da Peygamberimize neden “inanırız” dedi?",["Ondan hiç yalan duymamışlardı","Çok zengin olduğu için","Ondan korktukları için"],0],
     ["Kimler Müslüman olunca Müslümanların sayısı kırka ulaştı?",["Hz. Hamza ve Hz. Ömer","Ebû Tâlib ve Abdülmuttalib","Hz. Hasan ve Hz. Hüseyin"],0]]},
  {t:"Peygamberimizin Hicreti", s:"138–144", d:"Evinizden ve eşyalarınızdan ayrılıp başka bir şehre göç etmek zorunda kalsaydınız neler hissederdiniz? Bugün göç etmek zorunda kalan insanlara nasıl yardım edebiliriz?", p:[
   ["😟","Hicret kararı","Mekkeliler Peygamberimizi öldürmeye karar verdi. Bunu öğrenen Peygamberimiz, Müslümanları davet eden Medine’ye hicret etmeye karar verdi."],
   ["🛏️","Hz. Ali’nin cesareti","Peygamberimiz, kendisine bırakılan emanetleri sahiplerine geri vermesi için Hz. Ali’yi görevlendirdi. Hz. Ali o gece onun yatağında yattı."],
   ["🕸️","Sevr Mağarası","Peygamberimiz ve Hz. Ebû Bekir, aramaları şaşırtmak için Mekke’ye yakın Sevr Mağarası’nda üç gün saklandı. Esmâ yiyecek getirdi, Abdullah haber taşıdı."],
   ["🤲","“Üzülme, Allah bizimle”","Arayanlar mağaranın önüne kadar geldi. Hz. Ebû Bekir endişelenince Peygamberimiz “Üzülme, Allah bizimle beraberdir” dedi. Allah onları korudu."],
   ["🐪","Mekke’ye veda","Devesi Kusvâ’nın üstünde sevdiği Mekke’ye son kez baktı. 622 yılında, 53 yaşındayken hicret etti. Yolda Kuba’da İslam’ın ilk mescidini yaptılar."],
   ["🎶","Medine’de coşku","Medineliler onu “Hoş geldiniz ey Allah’ın Resûlü!” diyerek sevinçle karşıladı. Herkes onu kendi evinde ağırlamak istiyordu."],
   ["🏡","Ebû Eyyûb’un evi","Kimsenin gönlü kırılmasın diye devesini serbest bıraktı. Deve, Ebû Eyyûb el-Ensârî’nin evinin yakınına çöktü. Peygamberimiz orada yedi ay kaldı; o araziye Mescid-i Nebevî yapıldı."]],
  q:[["Mekke’den Medine’ye göçe ne denir?",["Hicret","Hac","Vahiy"],0],
     ["Hicrette Peygamberimizin yol arkadaşı kimdi?",["Hz. Ebû Bekir","Hz. Osman","Hz. Hamza"],0],
     ["Hicrette ilk yapılan mescit hangisidir?",["Kuba Mescidi","Mescid-i Aksâ","Mescid-i Nebevî"],0],
     ["Hicret hangi yılda oldu?",["622","571","610"],0],
     ["Emanetleri sahiplerine geri vermekle kim görevlendirildi?",["Hz. Ali","Hz. Ömer","Hz. Osman"],0],
     ["Peygamberimiz Medine’de kimin evinde misafir kaldı?",["Ebû Eyyûb el-Ensârî","Ebû Tâlib","Hz. Hamza"],0]]},
  {t:"Peygamberimizin Medine Hayatı", s:"145–149", d:"Ensar ile muhacir kardeş oldu. Kardeş olanlar birbirine nasıl davranmalı? Sınıfımızda bu kardeşliği nasıl yaşatabiliriz?", p:[
   ["🤗","Ensar ve muhacir kardeş","Peygamberimiz, Mekke’den göç eden muhacirlerle onlara yardım eden Medineli ensarı kardeş ilan etti. Evlerini, yiyeceklerini ve sevgilerini paylaştılar."],
   ["🕌","Örnek bir toplum","Sahabe Mescid-i Nebevî’de toplanır, Peygamberimizden Kur’an öğrenirdi. Herkes kötü alışkanlıklarını bırakıp güzel ahlâkı yaşamaya çalışırdı."],
   ["🛡️","Zor yıllar","Müslümanları yok etmek isteyen Mekkeliler saldırdı. Bedir, Uhud ve Hendek savaşları yapıldı."],
   ["🕋","Mekke’nin fethi","630 yılında Mekke fethedildi ve Kâbe putlardan temizlendi. Peygamberimiz birçok ülkeye elçiler göndererek insanları İslam’a davet etti."],
   ["🌄","Veda Haccı ve Veda Hutbesi","632 yılında yüz binden fazla Müslümanla hacca gitti. Arafat’ta Allah’ın herkesi eşit yarattığını ve insan haklarının korunması gerektiğini anlattı."],
   ["🌹","Vefatı","Medine’ye döndükten kısa bir süre sonra, 632 yılında vefat etti. Kabri Medine’dedir."]],
  q:[["Mekke’den göç edenlere yardım eden Medineli Müslümanlara ne denir?",["Ensar","Muhacir","Melek"],0],
     ["Mekke’den Medine’ye göç eden Müslümanlara ne denir?",["Muhacir","Ensar","İmam"],0],
     ["Mekke hangi yılda fethedildi?",["630","610","571"],0],
     ["Peygamberimizin son haccına ne denir?",["Veda Haccı","Umre","Hicret"],0],
     ["Peygamberimiz Veda Hutbesi’nde neyi anlattı?",["İnsanların eşit olduğunu ve haklarını","Sadece ticareti","Oyun kurallarını"],0],
     ["Peygamberimiz hangi yılda vefat etti?",["632","622","610"],0]]},
  {t:"Peygamberimizin Örnek Kişiliği", s:"150–168", d:"Peygamberimizin zamanında yaşayan bir çocuk olsaydınız ona ne sormak isterdiniz? Onun hangi davranışını bu hafta örnek alacaksınız?", p:[
   ["🌟","En güzel örnek","“Andolsun, Allah’ın Resûlünde sizin için güzel bir örnek vardır.” (Ahzâb Sûresi, 21. Ayet) İnsanlara öğrettiği güzel ahlâkı önce kendisi yaşardı."],
   ["🤝","Samimi dost","Arkadaşlarını arar, hasta olunca ziyaret eder, işlerinde onlara danışırdı. En yakın dostu Hz. Ebû Bekir’di."],
   ["🏡","İyi akraba ve komşu","Akrabalarını ziyaret eder, küslüğe izin vermezdi. Komşularına güler yüzle davranır, hatırlarını sorardı."],
   ["🧒","Şefkatli baba ve dede","Torunları Hasan ve Hüseyin’i sırtına alıp gezdirirdi. Mevsimin ilk meyvesini çocuklara ikram eder, onlarla oyun oynardı. Kızı Fâtıma gelince ayağa kalkıp karşılardı."],
   ["✔️","Özü sözü bir","Çocuğuna “Gel, sana bir şey vereceğim” diyen bir anneye, verecek bir şeyi olmasaydı bunun yalan sayılacağını söyledi. Ona inanmayanlar bile eşyalarını ona emanet ederdi."],
   ["🙂","Alçak gönüllü ve cömert","Kendi işini kendi görür, kimseyi küçük görmez, ikram edilen yemeği kötülemezdi. Arkadaşı beğenince ihtiyacı olan bir kumaşı hemen ona hediye etti."],
   ["🐦","Merhametli ve sabırlı","Yavruları alınan anne serçe için “Yavrularını hemen ona geri verin” dedi. Yanında büyüyen Enes, ondan bir kez bile “Of!” duymadığını anlatır."],
   ["⚖️","Âdil ve vefalı","Zengin-fakir ayırmadan herkese eşit davranırdı. Sütannesi Halime’yi “Anneciğim” diye karşılar, oturması için hırkasını yere sererdi."]],
  q:[["Peygamberimiz bizim için nedir?",["En güzel örnek","Bir masal kahramanı","Bir kral"],0],

inanc:`<svg viewBox="0 0 200 120" aria-hidden="true"><rect width="200" height="120" fill="#bfe0ff"/><circle cx="40" cy="28" r="10" fill="#fff" opacity=".8"/><circle cx="52" cy="26" r="13" fill="#fff" opacity=".8"/><circle cx="160" cy="22" r="9" fill="#fff" opacity=".8"/><path d="M0 98 Q100 82 200 98 V120 H0Z" fill="#7cc576"/><circle cx="30" cy="80" r="14" fill="#4fa64f"/><circle cx="172" cy="80" r="14" fill="#4fa64f"/><rect x="60" y="64" width="80" height="36" fill="#4a86e8"/><path d="M72 64 Q100 18 128 64Z" fill="#2f6fd6"/><rect x="98" y="26" width="4" height="8" fill="#f5b82e"/><circle cx="100" cy="24" r="4" fill="none" stroke="#f5b82e" stroke-width="2.5"/><rect x="50" y="40" width="9" height="60" fill="#5b92ee"/><path d="M48 40 L54.5 26 L61 40Z" fill="#2f6fd6"/><rect x="141" y="40" width="9" height="60" fill="#5b92ee"/><path d="M139 40 L145.5 26 L152 40Z" fill="#2f6fd6"/><path d="M92 100 V84 Q100 74 108 84 V100Z" fill="#1f4fa8"/><rect x="72" y="74" width="8" height="12" rx="4" fill="#cfe2ff"/><rect x="120" y="74" width="8" height="12" rx="4" fill="#cfe2ff"/></svg>`,
ibadet:`<svg viewBox="0 0 200 120" aria-hidden="true"><rect width="200" height="120" fill="#eaf6df"/><path d="M146 20 Q160 4 174 20 V58 H146Z" fill="#cfe7ff" stroke="#8cc0ff" stroke-width="3"/><line x1="160" y1="12" x2="160" y2="58" stroke="#8cc0ff" stroke-width="2"/><path d="M0 92 H200 V120 H0Z" fill="#9bd07c"/><path d="M40 88 L150 88 L170 110 L22 110Z" fill="#3fa3a8"/><path d="M50 92 L144 92 L158 106 L34 106Z" fill="none" stroke="#c6f0ec" stroke-width="2"/><ellipse cx="96" cy="94" rx="24" ry="8" fill="#2a4a8f"/><path d="M78 92 Q78 60 96 58 Q114 60 114 92Z" fill="#3aa65a"/><circle cx="96" cy="46" r="13" fill="#f6cfa8"/><path d="M83 44 Q96 28 109 44Z" fill="#fff"/><path d="M90 50 Q96 54 102 50" stroke="#7a4a2a" stroke-width="1.6" fill="none"/><path d="M88 74 L96 64 L104 74" fill="#f6cfa8"/><rect x="18" y="70" width="12" height="18" rx="2" fill="#c98a54"/><path d="M24 70 Q14 54 20 46 Q24 58 24 70 Q26 52 34 48 Q30 62 24 70" fill="#4fa64f"/></svg>`,
siyer:`<svg viewBox="0 0 200 120" aria-hidden="true"><rect width="200" height="120" fill="#ffe9b8"/><circle cx="150" cy="30" r="14" fill="#ffd36b"/><path d="M0 92 Q60 72 120 88 T200 84 V120 H0Z" fill="#f0c27b"/><rect x="30" y="56" width="70" height="34" fill="#e8c48f"/><path d="M48 56 Q65 30 82 56Z" fill="#e2b06a"/><rect x="24" y="30" width="7" height="60" fill="#e8c48f"/><path d="M22 30 L27.5 18 L33 30Z" fill="#d79c52"/><rect x="100" y="38" width="7" height="52" fill="#e8c48f"/><path d="M98 38 L103.5 26 L109 38Z" fill="#d79c52"/><path d="M176 90 V50" stroke="#8a5a2b" stroke-width="4"/><path d="M176 50 Q160 42 152 54 M176 50 Q192 40 198 52 M176 50 Q172 34 160 36 M176 50 Q184 34 194 38" stroke="#3a9a4a" stroke-width="5" fill="none" stroke-linecap="round"/><path d="M118 96 Q122 74 140 76 Q146 64 152 74 L156 74 Q160 78 158 82 L152 82 Q150 92 146 96" fill="#b07a45"/><path d="M124 96 V108 M132 96 V108 M142 96 V108 M148 96 V108" stroke="#8a5a2b" stroke-width="3"/><path d="M132 74 Q132 56 140 54 Q148 56 146 74Z" fill="#2a4a8f"/><circle cx="140" cy="50" r="6" fill="#2a4a8f"/></svg>`,
ahlak:`<svg viewBox="0 0 200 120" aria-hidden="true"><rect width="200" height="120" fill="#eaf6df"/><path d="M0 100 Q100 88 200 100 V120 H0Z" fill="#b6df9a"/><path d="M28 100 Q20 70 34 54 M34 74 Q20 66 18 58 M30 86 Q44 80 46 70" stroke="#4fa64f" stroke-width="4" fill="none" stroke-linecap="round"/><path d="M170 100 Q178 72 166 56 M168 76 Q182 70 184 60" stroke="#4fa64f" stroke-width="4" fill="none" stroke-linecap="round"/><path d="M160 26 C160 20 168 18 170 24 C172 18 180 20 180 26 C180 34 170 38 170 42 C170 38 160 34 160 26Z" fill="#3aa65a"/><path d="M70 118 Q70 64 100 60 Q130 64 130 118Z" fill="#e8823a"/><path d="M72 58 Q72 22 100 22 Q128 22 128 58 Q128 92 100 94 Q72 92 72 58Z" fill="#2f9a5a"/><circle cx="100" cy="56" r="20" fill="#f6cfa8"/><circle cx="93" cy="54" r="2.4" fill="#4a2a1a"/><circle cx="107" cy="54" r="2.4" fill="#4a2a1a"/><path d="M94 63 Q100 68 106 63" stroke="#a0442a" stroke-width="2" fill="none"/><rect x="84" y="86" width="32" height="22" rx="3" fill="#1f6f4a"/><line x1="100" y1="86" x2="100" y2="108" stroke="#a8e0c0" stroke-width="2"/></svg>`
};
const KID=`<svg width="104" height="104" viewBox="0 0 120 120" aria-hidden="true"><path d="M30 120 Q30 80 60 78 Q90 80 90 120Z" fill="#2f6fd6"/><circle cx="60" cy="52" r="28" fill="#f6cfa8"/><path d="M32 50 Q30 22 60 22 Q90 22 88 50 Q80 36 60 36 Q40 36 32 50Z" fill="#7a4a2a"/><path d="M34 36 Q60 4 86 36 Q60 28 34 36Z" fill="#fff" stroke="#cfe2ff" stroke-width="2"/><circle cx="50" cy="54" r="3.4" fill="#3a2414"/><circle cx="70" cy="54" r="3.4" fill="#3a2414"/><circle cx="44" cy="62" r="4" fill="#f5a9a0" opacity=".6"/><circle cx="76" cy="62" r="4" fill="#f5a9a0" opacity=".6"/><path d="M50 66 Q60 74 70 66" stroke="#a0442a" stroke-width="2.5" fill="none" stroke-linecap="round"/><rect x="40" y="88" width="40" height="28" rx="3" fill="#1f6f4a"/><rect x="56" y="94" width="8" height="16" rx="2" fill="none" stroke="#f5b82e" stroke-width="2"/></svg>`;
const PATTERN=`<svg class="pattern" width="100%" height="100%" aria-hidden="true"><defs><pattern id="pt" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M24 2 L30 18 L46 24 L30 30 L24 46 L18 30 L2 24 L18 18Z" fill="none" stroke="#fff" stroke-width="1.5"/></pattern></defs><rect width="100%" height="100%" fill="url(#pt)"/></svg>`;
const LANTERN=(x,h)=>`<svg class="lantern" style="left:${x}px" width="28" height="${h+44}" aria-hidden="true"><line x1="14" y1="0" x2="14" y2="${h}" stroke="#a9e3b6" stroke-width="2"/><path d="M6 ${h+6} Q14 ${h-4} 22 ${h+6} V${h+32} Q14 ${h+40} 6 ${h+32}Z" fill="#3aa65a"/><rect x="10" y="${h+12}" width="8" height="14" rx="4" fill="#fff6c8"/></svg>`;
const CHEV=c=>`<span class="chev"><svg width="16" height="16" viewBox="0 0 16 16"><path d="M6 3l5 5-5 5" stroke="${c}" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></span>`;
const ICON={
 home:'<path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z" fill="currentColor"/>',
 book:'<path d="M2 5c3-1 6-1 10 1 4-2 7-2 10-1v14c-3-1-6-1-10 1-4-2-7-2-10-1z M12 6v14" fill="none" stroke="currentColor" stroke-width="2"/>',
 chart:'<path d="M5 20V12M10 20V6M15 20V10M20 20V4" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>',
 user:'<circle cx="12" cy="8" r="4" fill="none" stroke="currentColor" stroke-width="2"/><path d="M4 21c1-5 15-5 16 0" fill="none" stroke="currentColor" stroke-width="2"/>'
};
const esc=s=>String(s).replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
const starStr=n=>[0,1,2].map(i=>i<n?"⭐":'<span class="off">⭐</span>').join("");

/* ---------- Ekranlar ---------- */
const app=document.getElementById("app");
let tab="home";
function renderNav(){
 const items=[["home","Ana Sayfa"],["units","Üniteler"],["prog","İlerlemem"],["prof","Profil"]];
 document.getElementById("nav").innerHTML=items.map(([k,l])=>`<button class="${tab===k?"on":""}" onclick="go('${k}')"><svg width="26" height="26" viewBox="0 0 24 24">${ICON[{home:"home",units:"book",prog:"chart",prof:"user"}[k]]}</svg>${l}</button>`).join("");
}
function go(k){tab=k;({home,units:unitsTab,prog,prof})[k]();renderNav();window.scrollTo(0,0)}

function home(){
 const d=doneCount(), n=nextUnit();
 app.innerHTML=`
 <header class="hero">${PATTERN}${LANTERN(18,30)}${LANTERN(44,58)}
  <button class="settings" style="right:66px" aria-label="Sınıf modu" aria-pressed="${clsOn()}" title="Sınıf modu (projeksiyon)" onclick="toggleCls();go('home')">${clsOn()?"🧒":"📽️"}</button>
  ${clsOn()?`<button class="settings" style="right:118px" aria-label="Tam ekran" title="Tam ekran (F)" onclick="toggleFS()">${fsIco("#2f6fd6")}</button>`:""}
  <button class="settings" aria-label="Profil" onclick="go('prof')"><svg width="22" height="22" viewBox="0 0 24 24"><path d="M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8zm9 4l-2.1-.6.4-2.2-2-1.2-1.5 1.6-2-.9L13.4 6h-2.8l-.4 2.7-2 .9-1.5-1.6-2 1.2.4 2.2L3 12l.2 2.3 2.1.6-.4 2.2 2 1.2 1.5-1.6 2 .9.4 2.4h2.8l.4-2.4 2-.9 1.5 1.6 2-1.2-.4-2.2 2.1-.6z" fill="#2f6fd6"/></svg></button>
  <div class="arch">
   <svg class="dome" width="70" height="48" viewBox="0 0 70 48" aria-hidden="true"><path d="M17 46 Q35 4 53 46Z" fill="#2f6fd6"/><rect x="6" y="20" width="6" height="26" fill="#2f6fd6"/><rect x="58" y="20" width="6" height="26" fill="#2f6fd6"/><path d="M38 2a7 7 0 1 0 0 12 5.5 5.5 0 1 1 0-12z" fill="#3aa65a"/></svg>
   <h1>Güzel Dinimi</h1><p>Öğreniyorum</p>
  </div>
 </header>
 <main>
  <div class="greet"><div><h2>Merhaba${S.name?", "+esc(S.name):""}! ⭐</h2><p>Bugün birlikte öğrenelim</p></div><div class="kid">${KID}</div></div>
  <div class="grid">${CATS.map((c,i)=>`<button class="cat ${c.c}" onclick="openCat(${i})">${ART[c.id]}<div class="lbl"><span>${c.name}<small>${c.sub}</small></span>${CHEV(c.c==="b"?"#2f6fd6":"#3aa65a")}</div></button>`).join("")}</div>
  <div class="panel journey"><svg width="46" height="46" viewBox="0 0 46 46" aria-hidden="true"><path d="M23 2l6 7 9-1-1 9 7 6-7 6 1 9-9-1-6 7-6-7-9 1 1-9-7-6 7-6-1-9 9 1z" fill="#3aa65a"/><path d="M23 13l3 6.5 7 .8-5.2 4.7 1.5 7L23 28.5 16.7 32l1.5-7L13 20.3l7-.8z" fill="#fff"/></svg>
   <div style="flex:1"><h3>Öğrenme Yolculuğum</h3><div class="bar"><i style="width:${d/TOTAL*100}%"></i></div><b>${d} / ${TOTAL}</b> ünite tamamlandı · ${starTotal()} ⭐</div></div>
  <button class="cta" ${n?"":"disabled"} onclick="continueNext()"><svg width="20" height="20" viewBox="0 0 20 20"><path d="M5 3l12 7-12 7z" fill="#fff"/></svg>${n?(d?"Öğrenmeye Devam Et":"Öğrenmeye Başla"):"Hepsini tamamladın! 🎉"}</button>
 </main>`;
}
function continueNext(){const n=nextUnit();if(n)openUnit(n[0],n[1])}
function unitList(ci){
 const c=CATS[ci];
 return c.units.map((u,ui)=>{const s=S.stars[uid(ci,ui)]||0;return `<button class="unit" onclick="openUnit(${ci},${ui})"><span class="num" style="background:var(--${c.c==="b"?"blue":"green"})">${ui+1}</span><span class="t">${esc(u.t)}<small class="pg">📖 Kitap s. ${u.s}</small></span><span class="stars">${starStr(s)}</span></button>`}).join("");
}
function openCat(ci){
 const c=CATS[ci];
 app.innerHTML=`<div class="top ${c.c}"><button class="back" aria-label="Geri" onclick="go('home')">${backIco()}</button><h2>${c.name}</h2>${topExtra()}</div><main><p class="intro">${c.units.length} ünite · Her ünitede ders kartları, bir sohbet sorusu ve ${c.units[0].q.length} test sorusu var.</p><div class="ulist">${unitList(ci)}</div></main>`;
 window.scrollTo(0,0);
}
const fsIco=c=>`<svg width="20" height="20" viewBox="0 0 16 16"><path d="M2 6V2h4M10 2h4v4M14 10v4h-4M6 14H2v-4" stroke="${c}" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
const topExtra=()=>clsOn()?`<button class="back fs" aria-label="Tam ekran" title="Tam ekran (F)" onclick="toggleFS()">${fsIco("#fff")}</button>`:"";
function backIco(){return '<svg width="18" height="18" viewBox="0 0 16 16"><path d="M10 3L5 8l5 5" stroke="#fff" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>'}
function unitsTab(){
 app.innerHTML=`<div class="top b"><h2>Üniteler</h2></div><main>${CATS.map((c,i)=>`<h3 style="margin:18px 2px 0;color:var(--${c.c==="b"?"blue-d":"green-d"});font-size:22px">${c.name}</h3><div class="ulist">${unitList(i)}</div>`).join("")}</main>`;
}
function prog(){
 app.innerHTML=`<div class="top b"><h2>İlerlemem</h2></div><main>
 <div class="panel" style="text-align:center"><div style="font-size:44px;font-weight:800;color:var(--blue-d)">${starTotal()} ⭐</div><div>${TOTAL*3} yıldızdan · ${doneCount()} / ${TOTAL} ünite</div></div>
 ${CATS.map((c,i)=>{const d=c.units.filter((u,ui)=>S.stars[uid(i,ui)]).length;return `<div class="panel"><div style="display:flex;justify-content:space-between;font-weight:700;font-size:19px"><span>${c.name}</span><span>${d} / ${c.units.length}</span></div><div class="bar"><i style="width:${d/c.units.length*100}%;background:var(--${c.c==="b"?"blue":"green"})"></i></div></div>`}).join("")}
 </main>`;
}
function prof(){
 app.innerHTML=`<div class="top b"><h2>Profil</h2></div><main>
 <div class="panel"><label class="f" for="nm">Adın veya sınıfın adı</label><input id="nm" type="text" maxlength="20" value="${esc(S.name)}" placeholder="Örneğin Ayşe veya 3-A"><button class="cta blue" onclick="S.name=document.getElementById('nm').value.trim();save();go('home')">Kaydet</button></div>
 <div class="panel"><label class="f">📽️ Sınıf Modu ${clsOn()?"(açık)":"(kapalı)"}</label><p style="margin:0 0 4px;color:var(--muted)">Projeksiyon veya akıllı tahta için: büyük yazı, geniş ekran, takım puanları. Klavye veya sunum kumandası ile: → / boşluk ileri, ← geri, A B C cevap, F tam ekran, Esc üniteler.</p><button class="cta blue" onclick="toggleCls();prof()">${clsOn()?"Sınıf modunu kapat":"Sınıf modunu aç"}</button></div>
 <button class="ghost" onclick="if(confirm('Tüm ilerleme silinsin mi?')){S.stars={};save();go('home')}">İlerlemeyi sıfırla</button>
 <p class="note">İçerik, Diyanet İşleri Başkanlığı’nın “Etkinliklerle Dinimi Öğreniyorum” kitabına (5. baskı, 2019) dayanır; ünite sırası ve sayfa numaraları kitaptakiyle aynıdır, metinler kısa özetlerdir. © Diyanet İşleri Başkanlığı. İlerleme yalnızca bu cihazda saklanır.</p>
 </main>`;
}

/* ---------- Ders + Quiz ---------- */
let L=null;
function openUnit(ci,ui){
 const u=CATS[ci].units[ui];
 L={ci,ui,u,step:0,score:0,qs:u.q.map(([q,o,a])=>{const opts=o.map((t,i)=>({t,ok:i===a}));for(let i=opts.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[opts[i],opts[j]]=[opts[j],opts[i]]}return{q,opts}})};
 drawLesson();
}
function drawLesson(){
 const {ci,u,step}=L, c=CATS[ci], P=u.p.length, D=u.d?1:0, n=P+D+u.q.length;
 L.qOff=P+D;
 const head=`<div class="top ${c.c}"><button class="back" aria-label="Geri" onclick="openCat(${ci})">${backIco()}</button><h2>${esc(u.t)}</h2>${topExtra()}</div>`;
 const bar=`<div class="steps">${Array.from({length:n},(_,i)=>`<i class="${i<=step?"on":""}"></i>`).join("")}</div>`;
 const hint=clsOn()?`<p class="hint">📖 Kitap s. ${u.s} · → / boşluk: ileri · ←: geri · A B C: cevap · F: tam ekran · Esc: üniteler</p>`:"";
 if(step<P+D){
  const talk=step>=P, [ic,h,p]=talk?["💬","Sınıfça konuşalım",u.d]:u.p[step];
  app.innerHTML=`${head}<div class="lesson">${bar}<div class="card pop${talk?" talk":""}"><div class="ic">${ic}</div><h3>${esc(h)}</h3><p>${esc(p)}</p></div>
  <div class="row">${step>0?`<button class="cta blue" id="prv" onclick="L.step--;drawLesson()">Geri</button>`:""}<button class="cta" id="nxt" onclick="L.step++;drawLesson()">${step===P+D-1?"Sorulara geç":"İleri"}</button></div>${hint}</div>`;
 } else if(step<n){
  const Q=L.qs[step-L.qOff];
  app.innerHTML=`${head}<div class="lesson">${bar}${teamBar()}<div class="card q pop" style="min-height:0"><div class="ic">❓</div><h3>${esc(Q.q)}</h3></div>
  ${Q.opts.map((o,i)=>`<button class="opt" data-i="${i}" onclick="answer(${i})"><b class="key">${String.fromCharCode(65+i)}</b><span>${esc(o.t)}</span></button>`).join("")}
  <div class="fb" id="fb" aria-live="polite"></div><button class="cta" id="nx" style="display:none" onclick="L.step++;drawLesson()">${step===n-1?"Sonucu gör":"Sıradaki soru"}</button>${hint}</div>`;
 } else finish();
 window.scrollTo(0,0);
}
function answer(i){
 const Q=L.qs[L.step-L.qOff], btns=[...document.querySelectorAll(".opt")];
 if(!Q||!btns[i]||btns.some(b=>b.disabled))return;
 btns.forEach((b,k)=>{b.disabled=true;if(Q.opts[k].ok)b.classList.add("ok")});
 const fb=document.getElementById("fb");
 if(Q.opts[i].ok){L.score++;fb.textContent="Aferin! Doğru cevap 🌟";fb.style.color="var(--green-d)"}
 else{btns[i].classList.add("no");fb.textContent="Doğru cevap yeşil olan. Bir dahakine! 💪";fb.style.color="var(--wrong)"}
 document.getElementById("nx").style.display="flex";
}
/* ---------- Takım puanları (sınıf modu) ---------- */
let TEAMS=[0,0];
function teamBar(){
 if(!clsOn())return "";
 return `<div class="teams">${TEAMS.map((v,i)=>`<div class="team t${i}"><span>${i?"B":"A"} Takımı</span><button aria-label="${i?"B":"A"} takımından puan sil" onclick="team(${i},-1)">−</button><b id="tm${i}">${v}</b><button aria-label="${i?"B":"A"} takımına puan ver" onclick="team(${i},1)">+</button></div>`).join("")}<button class="treset" aria-label="Takım puanlarını sıfırla" title="Puanları sıfırla" onclick="TEAMS=[0,0];team(0,0)">↺</button></div>`;
}
function team(i,d){TEAMS[i]=Math.max(0,TEAMS[i]+d);TEAMS.forEach((v,k)=>{const e=document.getElementById("tm"+k);if(e)e.textContent=v})}
function finish(){
 const {ci,ui,score}=L, total=L.qs.length, k=uid(ci,ui), stars=score===total?3:score>=total*2/3?2:1;
 S.stars[k]=Math.max(S.stars[k]||0,stars);save();
 const n=nextUnit();
 const msg=stars===3?"Harika! Hepsini bildin!":stars===2?"Çok güzel!":"Tebrikler, üniteyi bitirdin!";
 app.innerHTML=`<div class="done pop">${teamBar()}<div class="big">${starStr(stars)}</div><h2>${msg}</h2><p>${score} / ${total} doğru cevap</p>
 ${n?`<button class="cta" id="nxu" onclick="continueNext()">Sıradaki ünite</button>`:""}
 <button class="cta blue" onclick="openUnit(${ci},${ui})">Tekrar dene</button>
 <button class="ghost" onclick="go('home')">Ana sayfaya dön</button></div>`;
}

/* ---------- Klavye ve sunum kumandası ---------- */
document.addEventListener("keydown",e=>{
 if(e.ctrlKey||e.metaKey||e.altKey||/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName))return;
 const k=e.key, onBtn=e.target.tagName==="BUTTON"&&(k===" "||k==="Enter");
 if(k==="f"||k==="F"){toggleFS();return}
 const fwd=["ArrowRight","PageDown"," ","Enter"].includes(k), back=k==="ArrowLeft"||k==="PageUp";
 if(app.querySelector(".done")){if(fwd&&!onBtn){e.preventDefault();const b=document.getElementById("nxu");if(b)b.click()}return}
 if(!L||!app.querySelector(".lesson"))return;
 if(k==="Escape"){openCat(L.ci);return}
 const idx="abc123".indexOf(k.toLowerCase());
 if(idx>=0&&document.querySelector(".opt")){answer(idx%3);return}
 if(fwd&&!onBtn){
  e.preventDefault();
  const nxt=document.getElementById("nxt"), nx=document.getElementById("nx");
  if(nxt)nxt.click(); else if(nx&&nx.style.display!=="none")nx.click();
 } else if(back){
  e.preventDefault();
  const prv=document.getElementById("prv"); if(prv)prv.click();
 }
});

applyCls();
go("home");
</script>
</body>
</html>
