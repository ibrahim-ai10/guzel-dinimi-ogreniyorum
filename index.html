const mk=(s,cls)=>s.checked?(cls?" ok":" no"):"";
const WB_R={
 fill(X,s){let b=0;const lines=X.t.map(t=>esc(t).replace(/\[([^\]]+)\]/g,()=>{const j=b++,f=s.fill[j];return `<button class="blank${s.sel===j?" sel":""}${f!==null?" full":""}${s.checked?(f!==null&&s.bank[f]===s.ans[j]?" ok":" no"):""}" data-b="${j}">${f!==null?esc(s.bank[f]):"……"}</button>`}));
  const used=new Set(s.fill.filter(v=>v!==null));
  return `<ol class="lines">${lines.map(l=>`<li>${l}</li>`).join("")}</ol><div class="bank">${s.bank.map((w,j)=>`<button class="chipw${used.has(j)?" used":""}" data-w="${j}" ${used.has(j)?"disabled":""}>${esc(w)}</button>`).join("")}</div>`},
 match(X,s){const colors=["#f5b82e","#5b92ee","#3aa65a","#e25b4f","#a46ae0","#18a3a3"];const rp={};for(const l in s.pair)rp[s.pair[l]]=+l;
  const L=X.p.map((p,j)=>{const r=s.pair[j];const col=r!==undefined?colors[j%6]:"";return `<button class="mi${s.sel===j?" sel":""}${s.checked&&r!==undefined?(r===j?" ok":" no"):""}" data-l="${j}" style="${col?`--mc:${col}`:""}"><span class="dot"></span>${esc(p[0])}</button>`}).join("");
  const R=s.ro.map(j=>{const l=rp[j];const col=l!==undefined?colors[l%6]:"";return `<button class="mi r${s.checked&&l!==undefined?(l===j?" ok":" no"):""}" data-r="${j}" style="${col?`--mc:${col}`:""}"><span class="dot"></span>${esc(X.p[j][1])}</button>`}).join("");
  return `<div class="mcols"><div>${L}</div><div>${R}</div></div>`},
 order(X,s){return `<div class="oans${X.i.length>6?" two":""}">${X.i.map((_,k)=>{const j=s.ans[k];return j===undefined?`<div class="oslot"><b>${k+1}</b><span>……</span></div>`:`<button class="oslot full${s.checked?(j===k?" ok":" no"):""}" data-o="${k}"><b>${k+1}</b><span>${esc(X.i[j])}</span></button>`}).join("")}</div>
  <div class="bank">${s.pool.map(j=>s.ans.includes(j)?"":`<button class="chipw" data-p="${j}">${esc(X.i[j])}</button>`).join("")}</div>`},
 sort(X,s){const pool=s.ord.filter(j=>s.place[j]===undefined);
  return `<div class="bank">${pool.length?pool.map(j=>`<button class="chipw${s.sel===j?" sel":""}" data-s="${j}">${esc(X.i[j][0])}</button>`).join(""):`<span class="muted">Bütün kartlar yerleştirildi 👍</span>`}</div>
  <div class="bins">${X.c.map((cn,k)=>`<div class="bin${s.sel!==null?" hot":""}" data-c="${k}"><h4>${esc(cn)}</h4>${s.ord.filter(j=>s.place[j]===k).map(j=>`<button class="chipw in${s.checked?(X.i[j][1]===k?" ok":" no"):""}" data-u="${j}">${esc(X.i[j][0])}</button>`).join("")}</div>`).join("")}</div>`},
 tf(X,s){return `<div class="tfl">${X.i.map(([t,a],j)=>{const v=s.v[j];return `<div class="tfi${s.checked&&v!==undefined?(v===a?" ok":" no"):""}"><span>${esc(t)}</span><div class="tfb"><button class="${v===true?"on":""}" data-t="${j}" data-v="1">Doğru</button><button class="${v===false?"on":""}" data-t="${j}" data-v="0">Yanlış</button></div></div>`}).join("")}</div>`},
 ws(X,s){const n=s.g.length;return `<div class="wsw"><div class="wsg" style="--n:${n}">${s.g.map((row,r)=>row.map((ch,c)=>`<button class="wc${s.cells[r+","+c]?" f":""}${s.a&&s.a[0]===r&&s.a[1]===c?" a":""}" data-rc="${r},${c}">${ch}</button>`).join("")).join("")}</div>
  <ul class="wsl">${X.w.map(w=>`<li class="${s.found.includes(w)?"f":""}">${s.found.includes(w)?"✓ ":""}${w}</li>`).join("")}</ul></div>`},
 write(X){const key=wbKey(W.ci,W.ui,W.idx);const v=(S.wbt&&S.wbt[key])||[];return X.i.map((q,j)=>`<label class="wq"><span>${esc(q)}</span><textarea data-q="${j}" rows="3" placeholder="Buraya yaz…">${esc(v[j]||"")}</textarea></label>`).join("")}
};
function makeWS(words,n,rnd){
 const AL=[..."ABCÇDEFGĞHIİJKLMNOÖPRSŞTUÜVYZ"],D=[[0,1],[1,0],[1,1]];
 for(let at=0;at<300;at++){const g=Array.from({length:n},()=>Array(n).fill(""));let ok=true;
  for(const w of [...words].sort((a,b)=>b.length-a.length)){const L=[...w];let put=false;
   for(let t=0;t<300&&!put;t++){const d=D[Math.floor(rnd()*3)];if(L.length>n)break;const r=Math.floor(rnd()*(n-(d[0]?L.length-1:0))),c=Math.floor(rnd()*(n-(d[1]?L.length-1:0)));
    if(L.every((ch,k)=>{const x=g[r+d[0]*k][c+d[1]*k];return!x||x===ch})){L.forEach((ch,k)=>g[r+d[0]*k][c+d[1]*k]=ch);put=true}}
   if(!put){ok=false;break}}
  if(ok){for(const row of g)for(let c=0;c<n;c++)if(!row[c])row[c]=AL[Math.floor(rnd()*AL.length)];return{g}}}
 return{g:[[..."HATA"]]};
}
function wbMark(i,ok){S.wb=S.wb||{};if(ok){S.wb[wbKey(W.ci,W.ui,i)]=1;save()}}
function wbClick(e){
 const b=e.target.closest("button");if(!b||!W)return;const i=W.idx,X=W.list[i],a=b.dataset.a;
 if(a==="first"){W.idx=0;wbShow(-1);return}
 if(a==="nextunit"){const nx=nextIdx(W.ci,W.ui);if(nx)openWB(nx[0],nx[1],0,OV&&OV.back);return}
 if(!X)return;const s=wbState(i);
 if(a==="reset"){delete W.st[i];wbRefresh();return}
 if(a==="check"){const r=WB_CHECK[X.k](X,s);s.checked=true;s.res=r.ok?"ok":"no";s.msg=r.ok?"Harika! Hepsi doğru 🌟":r.msg||"Kırmızı olanları tekrar dene 💪";wbMark(i,r.ok);wbRefresh();return}
 s.checked=false;s.msg="";s.res="";const d=b.dataset;
 if(X.k==="fill"){
  if(d.b!==undefined){const j=+d.b;if(s.fill[j]!==null){s.fill[j]=null}s.sel=j}
  else if(d.w!==undefined){let j=s.sel;if(j===null||s.fill[j]!==null)j=s.fill.indexOf(null);if(j>=0){s.fill[j]=+d.w;const nx=s.fill.indexOf(null);s.sel=nx>=0?nx:null}}
 }else if(X.k==="match"){
  if(d.l!==undefined){const l=+d.l;if(s.pair[l]!==undefined)delete s.pair[l];s.sel=l}
  else if(d.r!==undefined){const r=+d.r;for(const l in s.pair)if(s.pair[l]===r)delete s.pair[l];if(s.sel!==null){s.pair[s.sel]=r;const free=X.p.findIndex((_,j)=>s.pair[j]===undefined);s.sel=free>=0?free:null}}
 }else if(X.k==="order"){
  if(d.p!==undefined)s.ans.push(+d.p);else if(d.o!==undefined)s.ans.splice(+d.o);
 }else if(X.k==="sort"){
  if(d.s!==undefined)s.sel=+d.s;else if(d.u!==undefined){delete s.place[+d.u]}
 }else if(X.k==="tf"){s.v[+d.t]=d.v==="1"}
 else if(X.k==="ws"){const [r,c]=d.rc.split(",").map(Number);
  if(!s.a)s.a=[r,c];else{const [r0,c0]=s.a;s.a=null;const dr=Math.sign(r-r0),dc=Math.sign(c-c0),len=Math.max(Math.abs(r-r0),Math.abs(c-c0))+1;
   if((r-r0===0||c-c0===0||Math.abs(r-r0)===Math.abs(c-c0))&&len>1){const cells=[];for(let k=0;k<len;k++)cells.push([r0+dr*k,c0+dc*k]);const word=cells.map(([y,x])=>s.g[y][x]).join("");
    const hit=X.w.find(w=>!s.found.includes(w)&&(w===word||w===[...word].reverse().join("")));
    if(hit){s.found.push(hit);cells.forEach(([y,x])=>s.cells[y+","+x]=1);if(s.found.length===X.w.length){s.res="ok";s.msg="Hepsini buldun! 🌟";wbMark(i,true)}else{s.msg=`${s.found.length} / ${X.w.length} kelime bulundu`}}
    else s.msg="Bu bir kelime değil, tekrar dene";}}
 }
 wbRefresh();
}
document.addEventListener("click",e=>{const bin=e.target.closest(".bin");if(!bin||!W||e.target.closest("button"))return;const X=W.list[W.idx],s=wbState(W.idx);if(X.k!=="sort"||s.sel===null)return;s.place[s.sel]=+bin.dataset.c;s.checked=false;s.msg="";s.res="";const left=s.ord.filter(j=>s.place[j]===undefined);s.sel=left.length?left[0]:null;wbRefresh()});
function wbInput(e){const t=e.target;if(!W||t.tagName!=="TEXTAREA")return;const key=wbKey(W.ci,W.ui,W.idx);S.wbt=S.wbt||{};const v=S.wbt[key]||[];v[+t.dataset.q]=t.value;S.wbt[key]=v;

const WB_CHECK={
 fill:(X,s)=>({ok:s.fill.every((f,j)=>f!==null&&s.bank[f]===s.ans[j]),msg:s.fill.includes(null)?"Önce bütün boşlukları doldur":""}),
 match:(X,s)=>({ok:X.p.every((_,j)=>s.pair[j]===j),msg:Object.keys(s.pair).length<X.p.length?"Önce hepsini eşleştir":""}),

function rdSetup(err){
 const s=document.getElementById("rstage");if(!s)return;

async function rdPick(fl){
 const files=[...fl].filter(f=>/\.pdf$/i.test(f.name)||f.type==="application/pdf").sort((a,b)=>a.name.localeCompare(b.name,"tr",{numeric:true}));
 if(!files.length)return;rdMsg("Kitap hazırlanıyor…");
 try{const arr=await Promise.all(files.map(async f=>({name:f.name,buf:await f.arrayBuffer()})));await rdLoad(arr);IDB.set("pdf",arr);rdRender(0)}
 catch(e){rdSetup("PDF açılamadı: "+e.message)}

async function rdLoad(arr){
 const lib=await loadPdfjs();const pages=[];R.files=arr;
 for(const f of arr){const doc=await lib.getDocument({data:new Uint8Array(f.buf.slice(0))}).promise;for(let k=1;k<=doc.numPages;k++)pages.push({doc,k})}
 R.pages=pages;R.cache.clear();const p=await pages[0].doc.getPage(pages[0].k);const v=p.getViewport({scale:1});R.ar=v.width/v.height;
 R.pos=Math.min(Math.max(1,R.pos),pages.length);
}
function rdTools(){
 const t=document.getElementById("rtools");if(!t)return;
 const T=[["hand","👆","Gezin / çevir"],["pen","✏️","Kalem"],["mark","🖍️","Fosforlu kalem"],["text","T","Yazı ekle"],["erase","🧽","Silgi"]];
 t.innerHTML=T.map(([k,ic,l])=>`<button class="rt${R.tool===k?" on":""}" title="${l}" aria-label="${l}" aria-pressed="${R.tool===k}" onclick="rdTool('${k}')">${ic}</button>`).join("")
  +`<span class="rsep"></span>`+PENS.map(c=>`<button class="rc${R.color===c?" on":""}" style="--c:${c}" aria-label="Renk" onclick="R.color='${c}';rdTools()"></button>`).join("")
  +`<span class="rsep"></span><button class="rt" title="Geri al" aria-label="Geri al" onclick="rdUndo()">↩️</button><button class="rt" title="Bu sayfadaki notları sil" aria-label="Notları sil" onclick="rdClear()">🗑️</button><button class="rt" title="Ayarlar" aria-label="Ayarlar" onclick="rdSettings()">⚙️</button>`;
 document.documentElement.dataset.rtool=R.tool;
}
function rdTool(k){R.tool=k;rdTools()}
function rdSpread(){const s=document.getElementById("rstage");return s&&s.clientWidth>=900&&s.clientWidth>s.clientHeight*1.15}
function rdVisible(p){if(R.mode==="spread"){const L=p%2===0?p:p-1;return[L,L+1]}return[p]}
function rdSize(){
 const s=document.getElementById("rstage");const W0=s.clientWidth-24,H0=s.clientHeight-20;
 R.mode=rdSpread()?"spread":"single";const cols=R.mode==="spread"?2:1;
 let h=H0,w=h*R.ar;if(w*cols>W0){w=W0/cols;h=w/R.ar}R.pw=Math.floor(w);R.ph=Math.floor(h);
}
async function rdCanvas(n){
 const key=n+":"+R.pw;if(R.cache.has(key))return R.cache.get(key);
 const pr=(async()=>{const P=R.pages[n-1];const page=await P.doc.getPage(P.k);const dpr=Math.min(window.devicePixelRatio||1,2);const v0=page.getViewport({scale:1});const v=page.getViewport({scale:R.pw*dpr/v0.width});
  const cv=document.createElement("canvas");cv.width=Math.round(v.width);cv.height=Math.round(v.height);await page.render({canvasContext:cv.getContext("2d"),viewport:v}).promise;return cv})();
 R.cache.set(key,pr);if(R.cache.size>14)R.cache.delete(R.cache.keys().next().value);return pr;
}
async function rdAnnFor(n){if(!R.ann[n])R.ann[n]=(await IDB.get("ann:"+n))||[];return R.ann[n]}
function rdPageEl(n){
 const d=document.createElement("div");d.className="ppage";d.style.width=R.pw+"px";d.style.height=R.ph+"px";
 if(!n||n>R.pages.length){d.classList.add("blank");return d}
 d.dataset.n=n;d.innerHTML=`<canvas class="pc"></canvas><canvas class="ac"></canvas><span class="pno">${n}</span>`;
 const dpr=Math.min(window.devicePixelRatio||1,2);for(const c of d.querySelectorAll("canvas")){c.width=Math.round(R.pw*dpr);c.height=Math.round(R.ph*dpr)}
 rdCanvas(n).then(src=>{const c=d.querySelector(".pc");c.getContext("2d").drawImage(src,0,0,c.width,c.height)});
 rdAnnFor(n).then(items=>drawAnn(d.querySelector(".ac"),items));
 rdBindDraw(d,n);return d;
}
function rdSpreadEl(p){const el=document.createElement("div");el.className="spread";for(const n of rdVisible(p))el.append(rdPageEl(n));return el}
function rdRender(dir){
 const st=document.getElementById("rstage");if(!st||!R.pages)return;let bk=document.getElementById("rbook");if(!bk){st.innerHTML='<div class="rbook" id="rbook"></div>';bk=document.getElementById("rbook")}rdSize();
 if(R.mode==="spread"&&R.pos%2===1&&R.pos>1)R.pos--; // çift sayfa solda
 const tot=document.getElementById("rtot");if(tot)tot.textContent="/ "+R.pages.length;
 const inp=document.getElementById("rpg");if(inp)inp.value=R.pos;if(S.bpos!==R.pos){S.bpos=R.pos;save()}
 if(R.mode==="spread"){bk.style.width=R.pw*2+"px";bk.style.height=R.ph+"px";bk.innerHTML="";bk.append(rdSpreadEl(R.pos))}
 else{bk.style.width=R.pw+"px";bk.style.height=R.ph+"px";const el=document.createElement("div");el.className="sp1";el.append(rdPageEl(R.pos));curlTo(bk,el,dir)}
 [R.pos-2,R.pos-1,R.pos+2,R.pos+3].forEach(n=>{if(n>=1&&n<=R.pages.length)rdCanvas(n)});
}
async function rdGo(d){
 if(!R.pages||R.busy)return;const step=R.mode==="spread"?2:1;const vis=rdVisible(R.pos);
 if(d<0&&vis[0]<=(R.mode==="spread"?0:1))return;if(d>0&&vis[vis.length-1]>=R.pages.length)return;
 const t=R.pos+d*step;
 if(R.mode!=="spread"||reduceMotion()){R.pos=Math.max(1,t);rdRender(d);return}
 // Çift sayfa: sağ sayfa sola doğru döner (ileri) / sol sayfa sağa döner (geri)
 const bk=document.getElementById("rbook"),sp=bk.querySelector(".spread");if(!sp){R.pos=Math.max(1,t);rdRender(d);return}
 R.busy=true;const [L,Rt]=rdVisible(R.pos);const nL=d>0?L+2:L-2;
 const front=d>0?Rt:L, back=d>0?nL:nL+1;
 const under=d>0?nL+1:nL; // altta görünecek sayfa
 const slots=sp.children;const keep=d>0?0:1;
 const leaf=document.createElement("div");leaf.className="leaf "+(d>0?"fwd":"bwd");leaf.style.width=R.pw+"px";leaf.style.height=R.ph+"px";
 const f=rdPageEl(front),b=rdPageEl(back);f.classList.add("face","front");b.classList.add("face","back");leaf.append(f,b);
 await Promise.all([front,back,under].filter(n=>n>=1&&n<=R.pages.length).map(n=>rdCanvas(n)));
 const und=rdPageEl(under);sp.replaceChild(und,slots[1-keep]);
 sp.append(leaf);requestAnimationFrame(()=>leaf.classList.add("go"));
 leaf.addEventListener("transitionend",()=>{R.pos=Math.max(1,t);R.busy=false;if(S.bpos!==R.pos){S.bpos=R.pos;save()}bk.innerHTML="";bk.append(rdSpreadEl(R.pos));const inp=document.getElementById("rpg");if(inp)inp.value=R.pos},{once:true});
 setTimeout(()=>{if(R.busy){R.busy=false;R.pos=Math.max(1,t);rdRender(0)}},1500);
}
function rdJump(p){if(!R.pages)return;R.pos=Math.min(Math.max(1,p|0),R.pages.length);rdRender(0)}
/* Notlar: kalem, fosforlu kalem, yazı, silgi — koordinatlar sayfaya göre (0–1) saklanır */
function drawAnn(cv,items){
 const x=cv.getContext("2d"),Wd=cv.width,H=cv.height;x.clearRect(0,0,Wd,H);
 for(const it of items){x.save();
  if(it.k==="t"){x.fillStyle=it.c;x.font=`700 ${it.fs*Wd}px "Baloo 2",system-ui,sans-serif`;x.textBaseline="top";it.s.split("\n").forEach((ln,i)=>x.fillText(ln,it.x*Wd,it.y*H+i*it.fs*Wd*1.15))}
  else{x.globalCompositeOperation=it.k==="m"?"multiply":"source-over";x.globalAlpha=it.k==="m"?.45:1;x.strokeStyle=it.c;x.lineWidth=it.w*Wd;x.lineCap=x.lineJoin="round";x.beginPath();const p=it.pts;x.moveTo(p[0]*Wd,p[1]*H);for(let i=2;i<p.length;i+=2)x.lineTo(p[i]*Wd,p[i+1]*H);if(p.length===2)x.lineTo(p[0]*Wd+.5,p[1]*H);x.stroke()}
  x.restore()}
}
function rdSaveAnn(n){clearTimeout(rdSaveAnn["t"+n]);rdSaveAnn["t"+n]=setTimeout(()=>IDB.set("ann:"+n,R.ann[n]),300)}
function rdBindDraw(d,n){
 const cv=d.querySelector(".ac");let cur=null;
 const pt=e=>{const r=cv.getBoundingClientRect();return[(e.clientX-r.left)/r.width,(e.clientY-r.top)/r.height]};
 cv.addEventListener("pointerdown",async e=>{
  if(R.tool==="hand")return;e.preventDefault();const items=await rdAnnFor(n);const [x,y]=pt(e);
  if(R.tool==="text"){rdTextAt(d,n,x,y);return}
  cv.setPointerCapture(e.pointerId);
  if(R.tool==="erase"){cur={erase:true};rdErase(items,x,y,cv,n);return}
  cur={k:R.tool==="mark"?"m":"p",c:R.tool==="mark"?"#ffd84d":R.color,w:R.tool==="mark"?.028:.0045,pts:[x,y]};items.push(cur);drawAnn(cv,items);
 });
 cv.addEventListener("pointermove",e=>{if(!cur)return;const [x,y]=pt(e);const items=R.ann[n];if(cur.erase){rdErase(items,x,y,cv,n);return}cur.pts.push(+x.toFixed(4),+y.toFixed(4));drawAnn(cv,items)});
 const end=()=>{if(cur){cur=null;rdSaveAnn(n)}};cv.addEventListener("pointerup",end);cv.addEventListener("pointercancel",end);
}
function rdErase(items,x,y,cv,n){const r=.02;let ch=false;for(let i=items.length-1;i>=0;i--){const it=items[i];let hit=false;
 if(it.k==="t")hit=x>=it.x-.01&&y>=it.y-.01&&x<=it.x+it.fs*it.s.length*.55&&y<=it.y+it.fs*1.4*(it.s.split("\n").length);
 else for(let k=0;k<it.pts.length;k+=2)if(Math.hypot(it.pts[k]-x,(it.pts[k+1]-y)/R.ar)<r){hit=true;break}
 if(hit){items.splice(i,1);ch=true}}if(ch)drawAnn(cv,items)}
function rdTextAt(d,n,x,y){
 const ta=document.createElement("textarea");ta.className="rtext";ta.style.left=x*100+"%";ta.style.top=y*100+"%";ta.style.color=R.color;ta.style.fontSize=Math.round(R.pw*.03)+"px";d.append(ta);ta.focus();setTimeout(()=>ta.focus(),0);
 const commit=()=>{const s=ta.value.trim();ta.remove();if(s){R.ann[n].push({k:"t",c:R.color,x,y,s,fs:.03});drawAnn(d.querySelector(".ac"),R.ann[n]);rdSaveAnn(n)}};
 ta.addEventListener("blur",commit);ta.addEventListener("keydown",e=>{if(e.key==="Escape"){ta.value="";ta.blur()}if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();ta.blur()}});
}
function rdRedrawAnn(){document.querySelectorAll("#rbook .ppage[data-n]").forEach(d=>{const n=+d.dataset.n;if(R.ann[n])drawAnn(d.querySelector(".ac"),R.ann[n])})}
function rdUndo(){for(const n of rdVisible(R.pos).reverse()){const a=R.ann[n];if(a&&a.length){a.pop();rdSaveAnn(n);rdRedrawAnn();return}}}
function rdClear(){const ns=rdVisible(R.pos).filter(n=>R.ann[n]&&R.ann[n].length);if(!ns.length)return;if(!confirm("Görünen sayfalardaki bütün notlar silinsin mi?"))return;ns.forEach(n=>{R.ann[n]=[];rdSaveAnn(n)});rdRedrawAnn()}
function rdSettings(){
 const s=document.getElementById("rstage");const old=s.querySelector(".rset");if(old){old.remove();return}
 s.insertAdjacentHTML("beforeend",`<div class="rset"><h4>⚙️ Kitap ayarları</h4>
 <label class="ghost"><input type="file" accept="application/pdf,.pdf" multiple hidden onchange="rdPick(this.files)">📂 Başka PDF seç</label>
 <button class="ghost" onclick="rdForget()">🗑️ Kitabı bu cihazdan kaldır</button>
 <p class="note">Notların sayfa numarasına göre bu cihazda saklanır.</p><button class="cta blue" onclick="this.closest('.rset').remove()">Kapat</button></div>`);
}
async function rdForget(){if(!confirm("Kitap dosyası bu cihazdan silinsin mi? (Notlar kalır)"))return;await IDB.del("pdf");R.pages=null;R.cache.clear();rdSetup()}
window.addEventListener("resize",()=>{clearTimeout(rdRender.t);rdRender.t=setTimeout(()=>{if(OV&&OV.kind==="book"&&R.pages){R.cache.clear();rdRender(0)}else if(OV&&OV.kind==="wb")wbRefresh()},200)});

/* ---------- Klavye ve sunum kumandası ---------- */
document.addEventListener("keydown",e=>{
 if(e.ctrlKey||e.metaKey||e.altKey||/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName))return;
 const k=e.key, onBtn=e.target.tagName==="BUTTON"&&(k===" "||k==="Enter");
 if(k==="f"||k==="F"){toggleFS();return}
 const fwd=["ArrowRight","PageDown"," ","Enter"].includes(k), back=k==="ArrowLeft"||k==="PageUp";
 if(OV){if(k==="Escape"){closeOv();return}if((fwd&&!onBtn)||back){e.preventDefault();const d=back?-1:1;if(OV.kind==="book")rdGo(d);else wbGo(d)}return}
 if(app.querySelector(".done")){if(fwd&&!onBtn){e.preventDefault();const b=document.getElementById("nxu");if(b)b.click()}return}
 if(!L||!app.querySelector(".lesson"))return;
 if(k==="Escape"){openCat(L.ci);return}
 const idx="abc123".indexOf(k.toLowerCase());
 if(idx>=0&&document.querySelector(".opt")){answer(idx%3);return}
 if(fwd&&!onBtn){
  e.preventDefault();
  const nxt=document.getElementById("nxt"), nx=document.getElementById("nx");
  if(nxt)nxt.click(); else if(nx&&nx.style.display!=="none")nx.click();
 } else if(back){
  e.preventDefault();
  const prv=document.getElementById("prv"); if(prv)prv.click();
 }
});

applyCls();
go("home");
</script>
